<head>
<meta charset="utf-8">

<title>영어 끝말잇기 챌린지</title>
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 게임 — 위에 진행 상태, 가운데 컴퓨터 단어 카드, 아래에 답 영역
   색: 밝은 화면 = 아케이드 퀘스트(두꺼운 테두리·아래 그림자 버튼, 남색 점수판), 어두운 화면 = 별밤 탐험(남색 밤하늘·별, 수준 색으로 빛남)
   수준(기초·보통·도전)마다 포인트 색(--lv-*)과 밝은 화면의 바탕(--lv-*-bg)이 다름. 끝 글자 강조(--key)는 수준과 관계없이 한 색 */
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface-2:#E9EBF6; --ink:#1C1F3A; --muted:#5A5F7A; --ink-2:#3A3F5C;
  --accent:#343E7B; --accent-ink:#FFFFFF; --link:#FFC83D; --link-soft:#FFF3CF; --link-ink:#3A2A00;
  --key:#343E7B; --key-ink:#FFFFFF; --key-soft:#E3E6F7;
  --good:#2E8B57; --good-soft:#DDF3E8; --bad:#C2453A; --bad-soft:#F8DCD8; --line:#D3D7EA;
  --shadow:0 2px 0 rgba(28,31,58,.12);
  --hud:#343E7B; --hud-ink:#FFFFFF;
  --outline:#1C1F3A; --chunk:0 4px 0 #1C1F3A; --chunk5:0 5px 0 #1C1F3A; --glow-r:0px; --glow-a:0%; --stars-o:0; --road-glow:0px; --map-bg:rgba(255,255,255,.65);
  --node-bd:#1C1F3A; --node-sh:0 5px 0 #1C1F3A; --lock-sh:0 5px 0 #B9BED6; --qm-bd:#1C1F3A; --qm-sh:0 6px 0 #1C1F3A; --in-bd:#1C1F3A;
  --lv-basic:#59BD93; --lv-basic-ink:#0E3324; --lv-basic-bg:#E7F6EF;
  --lv-normal:#5B67F0; --lv-normal-ink:#FFFFFF; --lv-normal-bg:#ECEEFF;
  --lv-hard:#F69B63; --lv-hard-ink:#3D1C06; --lv-hard-bg:#FFEFE4;
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-word:"Lexend","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --stars:radial-gradient(1.3px 1.3px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 68% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 86% 46%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 72%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 88%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 4% 55%,#fff 50%,transparent 51%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E2450; --surface:#2A3268; --surface-2:#343E7B; --ink:#FBFBFB; --muted:#C2C8E0; --ink-2:#DDE1F2;
  --accent:#FBFBFB; --accent-ink:#1E2450; --link:#FFD166; --link-soft:#4A4130; --link-ink:#2B2000;
  --key:#FBFBFB; --key-ink:#1E2450; --key-soft:#3A4380;
  --good:#59BD93; --good-soft:#1F4A44; --bad:#FF8A80; --bad-soft:#4A2433; --line:#3E4884;
  --shadow:0 2px 0 rgba(0,0,0,.35);
  --hud:#343E7B; --hud-ink:#FBFBFB;
  --outline:rgba(255,255,255,.18); --chunk:0 0 0 transparent; --chunk5:0 0 0 transparent; --glow-r:18px; --glow-a:22%; --stars-o:1; --road-glow:4px; --map-bg:rgba(255,255,255,.04);
  --node-bd:initial; --node-sh:initial; --lock-sh:none; --qm-bd:#3E4884; --qm-sh:0 14px 40px rgba(0,0,0,.45); --in-bd:#3E4884;
  --lv-basic:#59BD93; --lv-basic-ink:#0B2A1D; --lv-basic-bg:#1E2450;
  --lv-normal:#B7BEF5; --lv-normal-ink:#1E2450; --lv-normal-bg:#1E2450;
  --lv-hard:#F69B63; --lv-hard-ink:#2B1203; --lv-hard-bg:#1E2450;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E2450; --surface:#2A3268; --surface-2:#343E7B; --ink:#FBFBFB; --muted:#C2C8E0; --ink-2:#DDE1F2;
  --accent:#FBFBFB; --accent-ink:#1E2450; --link:#FFD166; --link-soft:#4A4130; --link-ink:#2B2000;
  --key:#FBFBFB; --key-ink:#1E2450; --key-soft:#3A4380;
  --good:#59BD93; --good-soft:#1F4A44; --bad:#FF8A80; --bad-soft:#4A2433; --line:#3E4884;
  --shadow:0 2px 0 rgba(0,0,0,.35);
  --hud:#343E7B; --hud-ink:#FBFBFB;
  --outline:rgba(255,255,255,.18); --chunk:0 0 0 transparent; --chunk5:0 0 0 transparent; --glow-r:18px; --glow-a:22%; --stars-o:1; --road-glow:4px; --map-bg:rgba(255,255,255,.04);
  --node-bd:initial; --node-sh:initial; --lock-sh:none; --qm-bd:#3E4884; --qm-sh:0 14px 40px rgba(0,0,0,.45); --in-bd:#3E4884;
  --lv-basic:#59BD93; --lv-basic-ink:#0B2A1D; --lv-basic-bg:#1E2450;
  --lv-normal:#B7BEF5; --lv-normal-ink:#1E2450; --lv-normal-bg:#1E2450;
  --lv-hard:#F69B63; --lv-hard-ink:#2B1203; --lv-hard-bg:#1E2450;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 55% at 50% 112%,color-mix(in srgb,var(--tc,var(--accent)) var(--glow-a),transparent),transparent 70%) fixed,var(--tc-bg,var(--bg));color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--key);outline-offset:2px}   /* 키보드 초점: 밝은 화면 남색·어두운 화면 흰색(노랑은 흰 바탕에서 잘 안 보임) */
.trackbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.word{font-family:var(--f-word)}
/* 수준별 색: 기초 초록 · 보통 청록 · 도전 주황 (맵의 길·단계 원, 첫 화면 버튼) */
[data-tc="basic"]{--tc:var(--lv-basic);--tc-ink:var(--lv-basic-ink);--tc-bg:var(--lv-basic-bg)} [data-tc="normal"]{--tc:var(--lv-normal);--tc-ink:var(--lv-normal-ink);--tc-bg:var(--lv-normal-bg)} [data-tc="hard"]{--tc:var(--lv-hard);--tc-ink:var(--lv-hard-ink);--tc-bg:var(--lv-hard-bg)}
.iconbtn{width:44px;height:44px;flex:none;padding:0;display:grid;place-items:center;font-size:20px;line-height:1;background:var(--surface);border:2px solid var(--line);border-radius:12px}
.iconbtn:hover{border-color:var(--accent)}

/* ===== 첫 화면: 제목 · 기초/보통/도전 · 단어 수첩(작게) ===== */
.title{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.title h1{font-size:clamp(34px,8vw,52px);line-height:1.1}
.title .sub{margin:0;font-family:var(--f-word);font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tracksel{display:grid;gap:14px;width:min(100%,340px);margin-top:22px}
.track{display:flex;align-items:center;gap:14px;padding:14px 22px;border-radius:20px;border:2px solid var(--outline);background:var(--tc);color:var(--tc-ink);box-shadow:var(--chunk5),0 0 var(--glow-r) color-mix(in srgb,var(--tc) 45%,transparent);font-family:var(--f-display);font-size:28px;text-align:left;transition:transform .12s,box-shadow .12s}
.track:hover{transform:translateY(-2px)}
.track:active{transform:translateY(3px);box-shadow:none}
.track .ic{font-size:32px;line-height:1}.track .nm{flex:1}
.track .pg{display:flex;gap:4px}.track .pg i{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;opacity:.45}.track .pg i.on{background:currentColor;opacity:1}
.rvsmall{margin-top:18px;background:none;border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:500;color:var(--ink-2)}
.rvsmall:hover{border-color:var(--accent)}
.rvsmall .cnt{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.title-ver{text-align:center;font-size:12px;color:var(--muted);opacity:.8}

/* ===== 규칙 창: 롤플레잉 게임 대화창처럼 2쪽, SKIP으로 빠져나감 ===== */
.rpg-ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,25,32,.62)}
.rpg{width:min(100%,480px);background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:16px 16px 14px;box-shadow:0 6px 0 var(--ink),0 20px 50px rgba(0,0,0,.35);animation:pop .3s ease}
.rpg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rpg-face{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:30px;background:var(--link-soft);border:2px solid var(--link)}
.rpg-name{font-family:var(--f-display);font-size:19px;line-height:1.2}.rpg-name small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.rpg-skip{margin-left:auto;align-self:flex-start;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-word);font-weight:700;font-size:13px;letter-spacing:.1em}
.rpg-skip:hover{border-color:var(--ink)}
.rpg-body{min-height:120px;padding:12px 14px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.rpg-body h3{font-size:22px;margin-bottom:8px}
.rpg-lines{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rpg-lines li{opacity:0;transform:translateY(6px);animation:rline .35s ease forwards;animation-delay:calc(var(--i) * 420ms)}
.rpg-lines.all li{animation:none;opacity:1;transform:none}
.rpg-lines .say{font-size:17px;font-weight:500}
.rpg-lines .timectl{justify-content:flex-start;margin:4px 0 0}
@keyframes rline{to{opacity:1;transform:none}}
.rpg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.rpg-dots{display:flex;gap:6px}.rpg-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.rpg-dots i.on{background:var(--ink)}
.rpg-next .tri{display:inline-block;margin-left:4px;animation:tri 1s ease-in-out infinite}
@keyframes tri{50%{transform:translateX(3px)}}

/* ===== 단계 맵: 단계를 이은 길, 마우스를 올리면 말풍선 설명 + 다른 단계는 흐리게 ===== */
.mapbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mapbar h2{flex:1;text-align:center;font-size:26px}
.maptools{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.map{position:relative;max-width:520px;height:var(--mh);margin:12px auto 0;border-radius:26px;border:2px solid var(--line);overflow:hidden;background-color:var(--map-bg);
  background:radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--tc) 14%,transparent),transparent 45%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--tc) 12%,transparent),transparent 45%))}
.map svg{position:absolute;inset:0;width:100%;height:100%;transition:filter .2s,opacity .2s}
.map .road{fill:none;stroke:var(--line);stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map .road.open{stroke:var(--tc);filter:drop-shadow(0 0 var(--road-glow) var(--tc))}
.map .lane{fill:none;stroke:var(--surface);stroke-width:3;stroke-dasharray:1 11;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.9}
.deco{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-size:26px;opacity:.5;pointer-events:none;transition:filter .2s,opacity .2s}
.node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:76px;height:76px;padding:0;border-radius:50%;border:4px solid var(--node-bd,var(--tc));background:var(--surface);color:var(--ink);box-shadow:var(--node-sh,0 0 16px color-mix(in srgb,var(--tc) 55%,transparent));font-family:var(--f-display);font-size:32px;line-height:1;display:grid;place-items:center;transition:filter .2s,opacity .2s,transform .15s}
.node .nl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:12px;padding:1px 10px;white-space:nowrap;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--ink)}
.node.cleared{background:var(--tc);color:var(--tc-ink)}
.node .ck{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--tc);font-size:13px;color:var(--tc)}
.node.locked{border-color:var(--line);background:var(--surface-2);color:var(--muted);box-shadow:var(--lock-sh);font-size:24px}
.node.cur::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--tc);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{opacity:.9;transform:scale(.85)}to{opacity:0;transform:scale(1.3)}}
.node.goal{border-style:dashed;font-size:30px;box-shadow:none;background:var(--surface);cursor:default;width:64px;height:64px}
.node.goal.cleared{border-style:solid;background:var(--tc)}
.node.on{transform:translate(-50%,-50%) scale(1.1);z-index:3}
.map.focus .node:not(.on),.map.focus .deco,.map.focus svg{filter:blur(2.5px) grayscale(.5);opacity:.35}
.tip{position:absolute;z-index:5;width:min(270px,calc(100% - 16px));padding:12px 14px;text-align:left;font-size:14px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink),0 14px 30px rgba(0,0,0,.2);animation:pop .2s ease}
.tip::after{content:'';position:absolute;left:var(--ax,50%);width:14px;height:14px;background:var(--surface);border:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.tip.up::after{bottom:-9px;border-top:0;border-left:0}.tip.down::after{top:-9px;border-bottom:0;border-right:0}
.tip h3{font-size:19px;margin-bottom:2px}.tip p{margin:2px 0 6px;color:var(--ink-2)}
.tip .meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
.tip .btn{width:100%;margin-top:10px}
.tip .lockmsg{margin:8px 0 0;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-weight:500;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.lock{background:var(--surface-2);color:var(--muted)}
.rules{margin-top:22px;background:var(--surface);border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.rules h2{font-size:20px;margin-bottom:6px}
.rules ul{margin:0;padding-left:20px;display:grid;gap:4px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
.ver{font-size:12px;opacity:.8;white-space:nowrap}
.linkbtn{background:none;border:none;padding:4px 2px;text-decoration:underline;color:var(--muted)}


/* ===== Game: 위 제목줄(☰ 단계 맵 · 제목 · 소리) → 상태 줄 → 채팅(주고받은 단어, 아래에서 밀려 올라감) 위 가운데 문제 창 ===== */
.gscreen{display:flex;flex-direction:column;min-height:calc(100dvh - 60px)}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ghead h2{flex:1;min-width:0;text-align:center;font-size:24px}
.gscreen .status{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:8px 14px;margin:0;background:var(--hud);color:var(--hud-ink);border-color:transparent}
.gscreen .status .label,.gscreen .status .score,.gscreen .status .diff{color:inherit}.gscreen .status .combo{color:var(--link)}
.gscreen .status .dot{background:rgba(255,255,255,.16);border-color:transparent}.gscreen .status .dot.on{background:var(--tc,var(--good));border-color:var(--tc,var(--good))}
.gscreen .status .label{margin:0}
.gbody{flex:1;position:relative;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px 0;min-height:300px}
.feed{position:absolute;inset:0;display:flex;flex-direction:column-reverse;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:12px 4px;pointer-events:none;transition:opacity .35s;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 56px);mask-image:linear-gradient(to bottom,transparent,#000 56px)}
.gbody:not(.free) .feed{opacity:.38}
.gbody.resting .feed{pointer-events:auto}
/* 휴대폰(좁은 화면·가로로 눕힌 휴대폰): 퀴즈 중에는 채팅을 숨기고(화면이 좁아 말풍선이 보였다 안 보였다 함) 통과 뒤 다시 보기에서만, 문제 창은 위쪽에 */
@media (max-width:640px),(pointer:coarse) and (max-height:500px){.gbody:not(.resting) .feed{display:none}.gbody:not(.resting){place-items:start center}}
.fl{list-style:none;margin:0 auto;padding:0;width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}   /* PC: 좌우 말풍선이 너무 멀지 않게 문제 창 폭으로 */
/* 카톡처럼: 컴퓨터는 왼쪽(🤖), 나는 오른쪽. 새 말풍선은 높이가 0 → 제 높이로 늘며 앞 말풍선을 밀어 올림 */
.fl li{display:flex;align-items:flex-end;gap:8px}.fl li.fm{justify-content:flex-end}.fl li.wait{display:none}
.fl li.up{overflow:hidden;animation:hlup var(--dur,600ms) cubic-bezier(.4,0,.2,1) both}.fl li.fc{transform-origin:left bottom}.fl li.fm{transform-origin:right bottom}
@keyframes hlup{from{max-height:0;margin-top:-12px;opacity:0;transform:translateY(16px) scale(.94)}to{max-height:var(--h,90px);margin-top:0;opacity:1;transform:none}}
.fav{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface);border:2px solid var(--line)}
.hb{font-family:var(--f-word);font-size:20px;font-weight:700;padding:7px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;max-width:70%;overflow-wrap:anywhere;text-align:left}
.fl li.fc .hb{border-bottom-left-radius:4px}.fl li.fm .hb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.hb.hid{color:var(--muted);letter-spacing:.15em;cursor:default}
.fl li.fdiv{justify-content:center;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.fl li.fdiv::before,.fl li.fdiv::after{content:'';flex:1;border-top:1px dashed var(--line)}
.qmodal{position:relative;z-index:2;width:min(100%,540px);padding:16px;background:var(--surface);border:2px solid var(--qm-bd);border-radius:22px;box-shadow:var(--qm-sh);transition:opacity .3s ease,transform .3s ease}
.qmodal.away{opacity:0;transform:translateY(14px) scale(.97);pointer-events:none}
.qmodal .cpu{background:var(--tc-bg,var(--bg));box-shadow:none}

@keyframes hold{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.btn.big{font-size:20px;padding:14px 34px;border-radius:16px}

/* 고른 단어 막대: 목록이 길어도 화면 아래에 붙어 보임 */

.blocks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:14px;padding:8px 10px 10px}

.blk{min-width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-word);font-weight:700;font-size:26px;box-shadow:var(--shadow)}

.note.center{text-align:center;margin:0 0 6px}

.lboxes{display:flex;justify-content:center;gap:5px;margin:6px 0 2px}

.card .sum{color:var(--ink)}

@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.buywrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.qty{display:flex;align-items:center;gap:6px;font-size:13px}.qty .tbtn{padding:0 9px;min-height:28px}

.hintbox > div{margin-top:4px}.lhint{padding:6px 10px}.lhint > div:first-child{margin-top:0}.lhint .speak{margin:0;padding:2px 10px}.lhint .pat{font-size:22px}.lack{font-size:12px;color:var(--bad)}.hcount{font-size:12px;color:var(--muted);white-space:nowrap}

// ---------- 단어장 만들기 ----------
const DICT = new Map();
function load(str, tier){
  str.split(/[|\n]/).map(s=>s.trim()).filter(Boolean).forEach(e=>{
    const sp=e.indexOf(' '); const raw=e.slice(0,sp), w=raw.toLowerCase(); let rest=e.slice(sp+1).trim(); let emoji='';
    if(!DICT.has(w)) DICT.set(w,{w,ko:rest,emoji,tier,d:raw!==w?raw:undefined});
  });
}

  const sp=e.indexOf(' '), w=(sp<0?e:e.slice(0,sp)).toLowerCase(), d=DICT.get(w);
  if(d){ d.core=lv; d.tier=Math.min(d.tier,lv); } else if(sp>0) DICT.set(w,{w,ko:e.slice(sp+1).trim(),emoji:'',tier:lv,core:lv}); }));
// 기본 어휘를 더 자주(SETTINGS.coreWeight배)
const CW=x=>x.core?SETTINGS.coreWeight:1;

const BL=(()=>{ try{ const d=JSON.parse(atob(typeof BLOCKLIST==='string'?BLOCKLIST:'')); return {exact:d.exact||[],strong:d.strong||[],allow:d.allow||[]}; }catch(e){ return {exact:[],strong:[],allow:[]}; } })();
// 비교 규칙: 소문자, 같은 글자 3번 이상 반복은 2번으로. 일부러 늘여 쓴 입력(3번 이상 반복)은 1번으로 줄인 형태도 비교
const norm2=w=>w.toLowerCase().replace(/(.)\1{2,}/g,'$1$1'), norm1=w=>w.toLowerCase().replace(/(.)\1+/g,'$1');
const BL_EX=new Set(BL.exact), BL_EX1=new Set(BL.exact.map(norm1)), BL_ST1=BL.strong.map(norm1), BL_AL=new Set(BL.allow);
// inVocab이면(단어장 단어) 강한 표현 포함 여부는 보지 않음 — class, grape, assistant 같은 정상 단어가 막히지 않게
function isBlocked(w,inVocab){
  const n2=norm2(w), st=/(.)\1\1/.test(w.toLowerCase());
  if(BL_EX.has(n2)||(st&&BL_EX1.has(norm1(w)))) return true;
  if(inVocab||BL_AL.has(n2)) return false;
  return BL.strong.some(x=>n2.includes(x))||(st&&BL_ST1.some(x=>norm1(w).includes(x)));
}

const byTier = t => ALL.filter(x=>x.tier<=t);

function isInflection(w){
  const b=[], n=w.length, dbl=s=>s.length>2&&s[s.length-1]===s[s.length-2]?s.slice(0,-1):null;
  if(w.endsWith('ies')) b.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) b.push(w.slice(0,-2));

  if(w.endsWith('ing')){ const s=w.slice(0,-3); b.push(s, s+'e', dbl(s)); }

}

// 철자 차이(바꾸기·넣기·빼기·이웃 글자 순서 바꾸기를 1로 셈)
function editDist(a,b,max){

    ${prac?`<div class="pat word" id="pracWord" aria-label="철자 ${esc(word)}">${esc(word)}</div>`:pat?`<div class="pat word" aria-label="빈칸 힌트">${esc(pat)}</div>`:''}
    <button class="speak" id="say">🔊 듣기</button>
  </div>
  <div class="ask">${prac?'위 철자를 그대로 써요':R.blanks?'빈칸을 채워 <b class="plain">단어 전체</b>를 써요':'들은 단어의 철자를 써요'}</div>
  <div id="answer">${enFormHTML('영어 단어','학습할 영어 단어','확인')}</div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="row" id="nextRow"></div>`;
  $app.querySelector('#back').onclick=reviewBack;
  $app.querySelector('#say').onclick=()=>{audioKeepAlive(true);const o=soundOn;soundOn=true;speak(d.w);soundOn=o;};
  setSndBtn(); $app.querySelector('#snd').onclick=()=>{soundOn=!soundOn;audioKeepAlive(soundOn);setSndBtn();};
  setTimeout(()=>{ if(R&&R.list[R.i]===it) speak(d.w,true); },SAY_DELAY);
  const inp=$app.querySelector('#inp'), nr=$app.querySelector('#nextRow');
  const nextBtn=(primary)=>`<button class="btn${primary?'':' soft'}" id="next">${R.i+1<R.list.length?'다음 단어 →':'끝내기'}</button>`;
  const bindNext=()=>{ const nx=nr.querySelector('#next'); nx.onclick=()=>{ R.i++; studyWord(); }; return nx; };
  enInput(inp,$app.querySelector('#f'),v=>{
    if(R.done) return; const a=v.trim().toLowerCase(); if(!a){ msg('단어를 써 주세요.','info'); return; }
    if(!DICT.has(a)&&isBlocked(a)){ inp.value=''; inp.focus({preventScroll:true}); msg(BLOCK_MSG,'info'); return; }
    const ok=a===d.w;
    // 연습하기: 보고 따라 쓰기 — 맞을 때까지, 맞으면 다시 도전
    if(prac){
      if(!ok){ msg(`철자를 다시 봐요: ${word}`,'bad'); inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.select(); return; }
      R.done=true; speak(d.w); inp.disabled=true; msg('잘했어요! 이제 철자를 보지 않고 다시 도전해요.','good');
      nr.innerHTML=`<button class="btn" id="retry">🔁 다시 도전</button>`;
      const rb=nr.querySelector('#retry'); rb.focus(); rb.onclick=()=>{ Object.assign(R,{phase:'test',tries:0,retried:true,done:false}); renderReview(); };
      return; }
    if(ok){
      R.done=true; R.right++; const r=learned?'':nbStamp(d.w); if(r) R.stamps++;
      msg(r==='learned'?`✔ 맞았어요! ${word} — 도장을 다 모아 '외운 단어'가 됐어요 🎉`:`✔ 맞았어요! ${word} = ${plainKo(d.ko)}${r?' · 도장 +1':''}`,'good');
      speak(d.w); inp.disabled=true; nr.innerHTML=nextBtn(true); bindNext().focus(); return; }
    R.tries++;
    if(R.tries<2){ msg('✗ 철자가 달라요. 한 번 더 써 보세요.','bad'); inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.select(); return; }
    // 두 번 틀림: 정답을 보여 주고, 처음이면 연습하기 → 다시 도전 기회
    R.done=true; speak(d.w); inp.disabled=true;
    if(!R.retried){
      msg(`✗ 정답은 ${word}예요. 철자를 보고 연습한 뒤 다시 도전해요.`,'bad');
      nr.innerHTML=`<button class="btn" id="prac">✏️ 연습하기</button>${nextBtn(false)}`;
      const pb=nr.querySelector('#prac'); pb.focus(); pb.onclick=()=>{ Object.assign(R,{phase:'practice',done:false}); renderReview(); }; bindNext();
    } else { msg(`✗ 정답은 ${word}예요. 다음에 또 학습해요.`,'bad'); nr.innerHTML=nextBtn(true); bindNext().focus(); }
  });
}

// 단어 수첩 화면: 모은 단어(뜻·도장, 누르면 그 단어 학습), 외운 단어(누르면 도장 없이 연습), 모두 학습하기, 수첩 비우기
function notebook(){

  // 단어장에서 빠진 단어(예전 단어장에만 있던 단어 등)는 저장은 그대로 두고 화면·개수에서만 뺌
  const items=nbList().sort((a,b)=>b.stamps-a.stamps||a.w.localeCompare(b.w)), learned=Object.values(nb.learned).filter(x=>DICT.has(x.w));
  // 모은 단어: 줄을 누르면(체크박스) 학습할 단어로 고름 → 아래 "선택한 단어 학습하기"로 넘어감
  const row=x=>{ const d=DICT.get(x.w); return `<li><label class="nbrow"><input type="checkbox" class="nbck" value="${esc(x.w)}" aria-label="${esc(disp(d))} 고르기"><b class="word">${esc(disp(d))}</b><span class="nbko">${esc(plainKo(d.ko))}</span>${stampHTML(x.stamps)}<small>${NB_REASON[x.reason]||''}</small></label></li>`; };

  ${items.length?`<div class="row" style="justify-content:flex-start;margin:0 0 6px"><button class="btn" id="study">✏️ 모두 학습하기 ${items.length}개</button></div>`:''}
  <section class="rules"><h2>모은 단어 ${items.length}개</h2>
    <p class="note">틀렸을 때 나온 예시와 힌트로 본 단어가 모여요.</p>
    ${items.length?`<ul class="nblist">${items.map(row).join('')}</ul>
    <div class="nbbar" role="group" aria-label="고른 단어"><button class="linkbtn" id="selAll" type="button">전체 선택</button><button class="btn" id="studySel" type="button" disabled>선택한 단어 학습하기 <b id="selN">0</b>개 ▶</button></div>`:'<p class="note">아직 모은 단어가 없어요.</p>'}</section>
  <section class="rules"><h2>외운 단어 ${learned.length}개</h2>
    ${learned.length?`<div class="nblearned">${learned.map(x=>{const d=DICT.get(x.w);return `<button class="chip ok word" data-w="${esc(x.w)}" aria-label="${esc(disp(d))} 연습하기">${esc(disp(d))}</button>`;}).join('')}</div>`:'<p class="note">도장을 다 모은 단어가 여기에 와요.</p>'}</section>
  <div class="foot"><span>수첩은 이 기기의 브라우저에만 저장돼요.</span><button class="linkbtn" id="nbclear">수첩 비우기</button></div>`;
  $app.querySelector('#back').onclick=goBack;

  $app.querySelectorAll('.nblearned [data-w]').forEach(b=>b.onclick=()=>startStudy([{w:b.dataset.w}],'nb'));

  const cks=[...$app.querySelectorAll('.nbck')], sb=$app.querySelector('#studySel'), sa=$app.querySelector('#selAll');

  sb?.addEventListener('click',()=>{ const ws=cks.filter(c=>c.checked).map(c=>nb.items[c.value]).filter(Boolean); if(ws.length) startStudy(ws,'nb'); });
  sync();
  confirmBtn('#nbclear','정말 비울까요? 한 번 더 누르세요',()=>{ nb={items:{},learned:{},tbSeen:[]}; nbSave(); notebook(); });
}

// ---------- 별 (점수를 모아 힌트 사기) ----------
// 이 기기의 localStorage(wordchain-stars-v1)에 숫자 하나만 저장. 모든 수준이 같은 별을 씀(공용 기기면 다른 학생이 모은 별도 쓰게 됨)
const STAR_KEY='wordchain-stars-v1';
let stars=0; try{ stars=Math.max(0,parseInt(localStorage.getItem(STAR_KEY),10)||0); }catch(e){}
function setStars(n){ stars=Math.max(0,n); try{ localStorage.setItem(STAR_KEY,String(stars)); }catch(e){} document.querySelectorAll('.stars-n').forEach(el=>el.textContent=stars); }
// 한 판이 끝날 때: 이번 판에서 얻은 점수 중 아직 바꾸지 않은 만큼을 별로(나머지는 이 단계 도전 안에서 이어짐)
function bankStars(){ if(!G) return 0; const P=SETTINGS.shop.pointsPerStar, n=Math.floor((G.score-(G.banked||0))/P); if(n>0){ G.banked=(G.banked||0)+n*P; setStars(stars+n); G.starsGot=(G.starsGot||0)+n; } return Math.max(0,n); }
// 별로 사기: 한 번 누르면 확인 문구, 3초 안에 한 번 더 누르면 사용(confirm 창 없이)
function armBuy(btn,price,label,fn){
  if(!btn) return; let armed=false,t; const orig=btn.innerHTML;
  btn.onclick=()=>{ if(G&&G.locked) return; if(stars<price) return;
    if(!armed){ armed=true; btn.classList.add('armed'); btn.innerHTML=`한 번 더 누르면 ⭐ ${price}개 사용`; t=setTimeout(()=>{ armed=false; btn.classList.remove('armed'); btn.innerHTML=orig; },3000); return; }
    clearTimeout(t); setStars(stars-price); fn(); };
}

// 수준 색: 단계 맵·게임 화면에서는 <html data-tc=수준>으로 그 수준의 바탕·포인트 색을 씀(첫 화면은 수준 색 없이)
function lvTheme(t){ const r=document.documentElement; if(t) r.setAttribute('data-tc',t); else r.removeAttribute('data-tc'); }
// ---------- 기록 지키기: 저장 공간 유지 요청 · 저장 가능 여부 · 기록 파일 저장/불러오기 ----------
// 기록 파일 = 진도(wordchain-v2)·수첩·별·배지를 JSON 하나로. 이름 등 개인 정보 없음. 선생님 모드 표시는 넣지 않음
const BACKUP_KEY='wordchain-backup-v1'; // {last:'YYYY-MM-DD'} 마지막으로 기록 파일을 저장한 날
const STORAGE_OK=(()=>{ try{ const k='wordchain-test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
// 브라우저가 저장 공간을 정리할 때 이 사이트 기록은 지우지 않게 요청(지원 안 하거나 거절돼도 그대로 동작)
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{}); }catch(e){}
function lastBackup(){ try{ return (JSON.parse(localStorage.getItem(BACKUP_KEY))||{}).last||null; }catch(e){ return null; } }
const daysSince=d=>{ const t=d?new Date(d+'T00:00:00').getTime():NaN; return isNaN(t)?Infinity:Math.floor((Date.now()-t)/864e5); };
function needBackup(){ if(!STORAGE_OK) return false;
  const any=Object.values(store.prog).some(p=>p&&p.cleared&&Object.keys(p.cleared).length)||nbList().length||stars>0||badges.length;
  return !!any&&daysSince(lastBackup()||store.since)>=SETTINGS.backupReminderDays; }
function exportData(){ if(track) store.prog[track]=save;
  return {app:'wordchain',schemaVersion:SCHEMA,saved:today(),data:{progress:store,notebook:nb,stars,badges}}; }
function downloadBackup(){ const url=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,1)],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=`wordchain-기록-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{ localStorage.setItem(BACKUP_KEY,JSON.stringify({last:today()})); }catch(e){} }
// 불러온 파일 확인: 형식이 맞으면 내용, 아니면 null(아무것도 바꾸지 않음). 더 새 앱에서 만든 파일도 받지 않음
function checkBackup(text){ let d=null; try{ d=JSON.parse(text); }catch(e){ return null; }
  if(!d||d.app!=='wordchain'||!d.data||typeof d.data!=='object'||(d.schemaVersion|0)>SCHEMA) return null;
  const x=d.data, p=x.progress, n=x.notebook;
  if(!p||typeof p!=='object'||!p.prog||typeof p.prog!=='object'||Array.isArray(p.prog)) return null;
  if(n!=null&&(typeof n!=='object'||!n.items||typeof n.items!=='object')) return null;
  if(x.badges!=null&&!Array.isArray(x.badges)) return null;
  if(x.stars!=null&&!(Number.isFinite(+x.stars)&&+x.stars>=0)) return null;
  return d; }
function backupSummary(d){ const x=d.data, P=x.progress.prog;
  const cl=Object.values(P).reduce((a,p)=>a+Object.keys((p&&p.cleared)||{}).length,0);
  return `통과한 단계 ${cl}개 · 수첩 단어 ${Object.values((x.notebook&&x.notebook.items)||{}).filter(nbShown).length}개 · 별 ${parseInt(x.stars,10)||0}개 · 배지 ${(x.badges||[]).length}개${d.saved?` (${esc(String(d.saved))}에 저장)`:''}`; }
function applyBackup(d){ const x=JSON.parse(JSON.stringify(d.data));
  store=migrateStore(x.progress); nb=Object.assign({items:{},learned:{},tbSeen:[]},x.notebook||{}); badges=x.badges||[];
  try{ localStorage.setItem(KEY,JSON.stringify(store)); localStorage.setItem(NB_KEY,JSON.stringify(nb)); localStorage.setItem(BADGE_KEY,JSON.stringify(badges)); }catch(e){}
  setStars(parseInt(x.stars,10)||0);
  setTrack(TRACKS[track]?track:TRACKS[store.track]?store.track:'basic'); }
// 단계 맵 아래: 💾 저장하기 · 📂 불러오기(파일 확인 → 요약 + '이 기록으로 바꾸기'를 한 번 더 눌러야 바뀜)
function backupHTML(){ return `<div class="backup">${needBackup()?'<p class="bkhint">기록을 저장해 둘까요?</p>':''}
    <div class="bkrow"><button class="back" id="bkSave">💾 내 기록 저장하기</button><button class="back" id="bkLoad">📂 기록 불러오기</button></div>
    <input type="file" id="bkFile" accept=".json,application/json" hidden><div class="bkmsg" id="bkMsg" aria-live="polite"></div></div>`; }
function bindBackup(){ const m=$app.querySelector('#bkMsg'), f=$app.querySelector('#bkFile');
  $app.querySelector('#bkSave').onclick=()=>{ downloadBackup(); $app.querySelector('.bkhint')?.remove(); m.innerHTML='<p>기록 파일을 내려받았어요. 잘 보관해 두세요.</p>'; };
  $app.querySelector('#bkLoad').onclick=()=>{ f.value=''; f.click(); };
  f.onchange=async()=>{ const file=f.files&&f.files[0]; if(!file) return; let text=''; try{ text=await file.text(); }catch(e){}
    const d=checkBackup(text);
    if(!d){ m.innerHTML='<p class="bad">끝말잇기 기록 파일이 아니에요. 지금 기록은 그대로예요.</p>'; return; }
    m.innerHTML=`<p>${backupSummary(d)}</p><p><b>이 기록으로 바꿀까요? 지금 기록은 덮어써져요.</b></p>

// ---------- 규칙 창(롤플레잉 게임 대화창): 쪽마다 줄이 하나씩 나오고, 다음 ▶ 으로 넘김, SKIP으로 바로 닫음 ----------
// pages: [{title, lines:[html]}], done: 마지막 쪽 버튼 글자, onDone: 닫힌 뒤(SKIP 포함), bind(쪽 요소): 쪽 안 버튼 연결
// 자동 테스트는 window.__wordchainNoIntro로 규칙 창을 건너뜀
const LINE_GAP=420;
function rpg(o){
  if(window.__wordchainNoIntro){ o.onDone(); return; }
  document.querySelector('.rpg-ov')?.remove();
  const ov=document.createElement('div'); ov.className='rpg-ov';
  ov.innerHTML=`<div class="rpg" role="dialog" aria-modal="true" aria-labelledby="rpgTitle"><div class="rpg-head"><span class="rpg-face" aria-hidden="true">🤖</span><span class="rpg-name">끝말봇<small>${esc(o.who||'')}</small></span><button class="rpg-skip" id="rpgSkip" aria-label="규칙 건너뛰기">SKIP ⏭</button></div><div id="rpgPage"></div></div>`;
  document.body.appendChild(ov);
  let i=0, t0=0;
  const close=()=>{ document.removeEventListener('keydown',onKey,true); ov.remove(); o.onDone(); };
  const page=()=>{ const P=o.pages[i], lastP=i===o.pages.length-1; t0=Date.now();
    ov.querySelector('#rpgPage').innerHTML=`<div class="rpg-body"><h3 id="rpgTitle">${P.title}</h3><ul class="rpg-lines">${P.lines.map((l,k)=>`<li style="--i:${k}">${l}</li>`).join('')}</ul></div>
      <div class="rpg-foot"><span class="rpg-dots" aria-label="${i+1} / ${o.pages.length}쪽">${o.pages.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><button class="btn rpg-next" id="rpgNext">${lastP?o.done:'다음'}<span class="tri" aria-hidden="true">▶</span></button></div>`;
    P.bind&&P.bind(ov.querySelector('#rpgPage'));
    const nx=ov.querySelector('#rpgNext'); nx.onclick=next; nx.focus(); };
  // 줄이 아직 나오는 중이면 한 번에 모두 보여 주고, 다 나왔으면 다음 쪽(마지막 쪽이면 닫기)
  const next=()=>{ const ul=ov.querySelector('.rpg-lines'), n=o.pages[i].lines.length;
    if(!calm()&&!ul.classList.contains('all')&&Date.now()-t0<(n-1)*LINE_GAP+350){ ul.classList.add('all'); return; }
    if(i<o.pages.length-1){ i++; page(); } else close(); };
  const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); close(); } };
  document.addEventListener('keydown',onKey,true);
  ov.querySelector('#rpgSkip').onclick=close;
  page();
}
// 수준 규칙(2쪽, 짧게): ① 이 수준은 어떤 곳인지·끝말잇기 방법 ② 모든 단계에 공통인 규칙(하트/연속 기록·힌트·통과). 단계 규칙 창에서는 되풀이하지 않음
function trackIntro(){

      `🎯 단계 목표만큼 ${lv?'성공':'연속으로 성공'}하면 다음 단계가 열려요.`,

const MODE_TIP={spell:'숫자 키 1~4로도 골라요.',blocks:'키보드로 쳐도 돼요. Backspace로 되돌려요.',blanks:'첫 칸은 내 단어의 <b>끝 글자</b>예요.'};
// 단계 규칙(2쪽, 짧게): ① 컴퓨터의 한마디·단계 설명 ② 이 단계만의 것(목표 수·팁·듣기·제한 시간 조절)
function stageIntro(id){
  const L=LEVELS[id-1], k=`${track}-${L.id}`, lv=livesOn();
  const line=rnd(REST_LINES[k]||(L.listen==='force'?REST_LINES.listen:L.time?REST_LINES.time:REST_LINES.other));

  if(MODE_TIP[L.mode]) how.push(MODE_TIP[L.mode]);

  else if(L.listenOpt) how.push(`🎧 '듣고 쓰기'를 켜면 점수 ×${SETTINGS.score.listen}!`);
  if(L.time) how.push(`⏱ 단어마다 제한 시간이 있어요.${timeCtlHTML(L)}`);
  rpg({who:`${TRACKS[track].name} ${L.id}단계 안내`,done:'시작하기',onDone:()=>start(id),pages:[
    {title:`${L.id}단계 · ${esc(L.name)}`,lines:[`<span class="say">“${esc(line)}”</span>`,esc(L.desc)]},
    {title:'🎯 이번 단계',lines:how,bind:el=>L.time&&bindTimeCtl(el,L)}]});
}

// 보기에서는 끝의 괄호 설명을 뺀 뜻만: "프린터 (print+er)" → "프린터" (만(바다), (활동) 시간처럼 붙은 괄호는 그대로)
const plainKo=ko=>ko.replace(/\s+\([^()]*\)$/,'');

// 한글 자판(두벌식)으로 친 글자를 같은 자리의 영문 글자로 바꿈: 메ㅔㅣㄷ → apple
const KO_KEY={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m',
  'ㅃ':'q','ㅉ':'w','ㄸ':'e','ㄲ':'r','ㅆ':'t','ㅒ':'o','ㅖ':'p','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅢ':'ml',
  'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
const KO_RE=/[ㄱ-ㅣ가-힣]/;
function koToEn(s){ return [...s].map(c=>{ const n=c.charCodeAt(0)-0xac00;
  if(n>=0&&n<11172){ const t=n%28; return KO_KEY[CHO[Math.floor(n/588)]]+KO_KEY[JUNG[Math.floor(n%588/28)]]+(t?KO_KEY[JONG[t]]:''); }
  return KO_KEY[c]||c; }).join(''); }
function latinize(inp){ const v=inp.value; if(!KO_RE.test(v)) return false;
  const pos=koToEn(v.slice(0,inp.selectionStart)).length; inp.value=koToEn(v); inp.setSelectionRange(pos,pos); return true; }
// 휴대폰에서 "내기"·"확인"을 한 번만 눌러도 제출: 손가락으로 누르면 입력칸 초점을 그대로 둬서(자판이 내려가며 화면이 움직이지 않게)
// 손을 떼는 순간 제출하고, 뒤따르는 click은 무시(두 번 제출 안 함). 마우스·키보드(Enter)는 그대로
(()=>{ let armed=null, until=0;
  const sb=t=>t&&t.closest&&t.closest('form button[type=submit]');
  document.addEventListener('pointerdown',e=>{ armed=null; if(e.pointerType!=='touch') return; const b=sb(e.target); if(!b||b.disabled) return; armed=b; e.preventDefault(); },true);
  document.addEventListener('pointerup',e=>{ const b=armed; armed=null; if(!b||e.pointerType!=='touch') return;
    const at=document.elementFromPoint(e.clientX,e.clientY); if(!at||!b.contains(at)||b.disabled||!b.form) return;   // 손가락이 버튼 밖으로 나갔으면 취소
    until=Date.now()+800; e.preventDefault(); if(b.form.requestSubmit) b.form.requestSubmit(b); else b.form.dispatchEvent(new Event('submit',{cancelable:true})); },true);
  document.addEventListener('pointercancel',()=>{ armed=null; },true);
  document.addEventListener('click',e=>{ if(Date.now()<until&&sb(e.target)){ e.preventDefault(); e.stopPropagation(); } },true);
})();
// 영어 단어 입력칸(게임·복습·빈칸 채우기 공통)
// inputmode=email: 휴대폰에서 영문 자판이 뜸. lang=en: 일부 PC 브라우저가 영문 입력기로 전환
// 자동 완성·자판 추천 끄기: autocomplete="off"(휴대폰·크롬북 화면 자판이 추천 단어 줄을 끄는 신호) + autocorrect·autocapitalize·spellcheck 끔
// + 입력칸마다 매번 새 name(Chrome이 예전에 쓴 답을 목록으로 제안하지 않게)
const AC_OFF='off';
const acName=()=>'w'+Math.random().toString(36).slice(2,9);
const enFormHTML=(ph,label,btn)=>`<form class="typing" id="f" autocomplete="off"><input id="inp" name="${acName()}" type="text" lang="en" inputmode="email" autocomplete="${AC_OFF}" aria-autocomplete="none" data-lpignore="true" data-1p-ignore data-form-type="other" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" aria-label="${esc(label)}"><button class="btn" type="submit">${btn}</button></form>`;
// 한글 자판: 입력기가 글자를 조합하는 동안 값을 바꾸면 글자가 빠지므로(rose → roe) 조합이 끝난 뒤에만 영어로 바꿈.
// 조합 중에는 바뀔 영어를 안내만 하고, 낼 때 한 번 더 바꿈. onInput(값): 글자가 바뀔 때마다(빈칸 채우기 미리 보기용)
function enInput(inp,form,onSubmit,onInput){
  inp.focus({preventScroll:true}); let composing=false;
  const koNote=()=>{ const e=koToEn(inp.value); msg(isBlocked(e,DICT.has(e.toLowerCase()))?'한글 자판이에요. 한/영 키를 눌러 영어로 바꿔 주세요.':`한글 자판이에요 → "${e}"(으)로 낼게요. 한/영 키를 눌러 영어로 바꾸면 편해요.`,'info'); };
  inp.addEventListener('compositionstart',()=>{composing=true;});
  inp.addEventListener('compositionend',()=>{ composing=false; setTimeout(()=>{ if(!composing&&latinize(inp)) koNote(); onInput&&onInput(koToEn(inp.value)); },0); });
  inp.addEventListener('input',e=>{ if(KO_RE.test(inp.value)){ if(e.isComposing||composing) koNote(); else if(latinize(inp)) koNote(); } onInput&&onInput(koToEn(inp.value)); });
  form.onsubmit=e=>{e.preventDefault(); onSubmit(koToEn(inp.value));};
  engKeys(inp);
}
// 영문 고정: 실제 키보드에서 한글 입력기가 켜져 있으면(누른 키가 입력기로 넘어가면) 입력칸을 영문 고정으로 바꾸고,
// 누른 키 자리(e.code)의 영어 글자를 바로 넣음 — 한글 자판이어도 영어로 써짐(웹 페이지는 운영체제의 한/영 상태를 바꿀 수 없음).
// 입력기는 고칠 수 있는 칸에서만 글자를 조합하므로 칸을 readOnly로 두고 글자는 스크립트가 씀(보이지 않는 커서는 .fcaret로 대신 그림).
// 한 번 알아채면 이 페이지의 다른 입력칸도 영문 고정. 휴대폰 화면 키보드(e.code 없음)는 그대로 두고 입력이 끝난 뒤 영어로 바꿈(latinize).
// 손가락으로 입력칸을 누르면(화면 키보드가 떠야 하므로) 영문 고정을 끔
let engMode=false;
const imeKey=e=>/^Key[A-Z]$/.test(e.code)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='Process'||e.keyCode===229||e.isComposing||KO_RE.test(e.key||''));
function engKeys(el,single){
  let cr=null;
  const caret=()=>{
    if(!el.readOnly||document.activeElement!==el||!el.isConnected){ if(cr){ cr.remove(); cr=null; } return; }
    const p=el.parentNode; if(getComputedStyle(p).position==='static') p.style.position='relative';
    if(!cr){ cr=document.createElement('span'); cr.className='fcaret'; cr.setAttribute('aria-hidden','true'); p.appendChild(cr); }
    const cs=getComputedStyle(el), c=engKeys.ctx||(engKeys.ctx=document.createElement('canvas').getContext('2d'));
    c.font=cs.font; if('letterSpacing' in c) c.letterSpacing=cs.letterSpacing;
    const v=el.value, pos=el.selectionStart??v.length, fs=parseFloat(cs.fontSize), h=fs*1.25;
    const x=cs.textAlign==='center'?el.offsetLeft+el.offsetWidth/2+c.measureText(v).width/2+1
      :el.offsetLeft+parseFloat(cs.borderLeftWidth)+parseFloat(cs.paddingLeft)+c.measureText(v.slice(0,pos)).width-el.scrollLeft;
    cr.style.cssText=`left:${Math.round(x)}px;top:${Math.round(el.offsetTop+(el.offsetHeight-h)/2)}px;height:${Math.round(h)}px`;
  };
  const changed=()=>{ el.dispatchEvent(new Event('input',{bubbles:true})); caret(); };
  const put=s=>{
    if(single){ el.value=s; changed(); return; }
    const a=el.selectionStart??el.value.length, b=el.selectionEnd??a;
    el.value=el.value.slice(0,a)+s+el.value.slice(b); el.setSelectionRange(a+s.length,a+s.length); changed();
  };
  const on=()=>{ el.readOnly=true; el.setAttribute('aria-readonly','false'); el.classList.add('engmode'); caret(); };
  if(engMode) on();
  // 처음 알아챈 순간 화면의 다른 입력칸(빈칸 채우기의 다음 칸 등)도 함께 영문 고정 — 그래야 입력기가 남긴 한글이 다음 칸에 들어가도 버려짐
  engKeys.ons=(engKeys.ons||[]).filter(o=>o.el.isConnected); engKeys.ons.push({el,on});

function startsWith(ch,pool){return pool.filter(x=>x.w[0]===ch&&!G.used.has(x.w));}

function pickCpu(firstCh){
  let cands=G.cpuPool.filter(x=>!G.used.has(x.w)&&(!firstCh||x.w[0]===firstCh)&&startsWith(last(x.w),G.pool).length>=(G.L.mode==='type'?3:1));
  if(!cands.length) return null;
  // 학생이 시작할 글자가 겹치지 않게: 최근 두 번 요구한 글자로 끝나는 단어는 피함 (없으면 허용)
  const recent=G.asked.slice(-2), fresh=cands.filter(x=>!recent.includes(last(x.w)));

  const groups=new Map(); cands.forEach(x=>{const ch=last(x.w); if(!groups.has(ch)) groups.set(ch,[]); groups.get(ch).push(x);});
  const letters=[...groups.keys()];
  const lw=ch=>{let k=Math.min(startsWith(ch,G.pool).length,15)/15; if(ch==='y')k*=.25; return k;};
  const ws=letters.map(lw), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<letters.length;i++){ r-=ws[i]; if(r<=0) return pickCore(groups.get(letters[i])); }
  return pickCore(groups.get(letters[letters.length-1]));
}

function makeOptions(){
  const ch=last(G.cur.w);

  const right=pickCore(good.length?good:startsWith(ch,G.pool));
  const wrongAll=G.pool.filter(x=>x.w[0]!==ch&&x.w!==G.cur.w);
  const wrong=[];
  if(G.L.n>=4){ const trap=wrongAll.filter(x=>last(x.w)===ch); if(trap.length) wrong.push(rnd(trap)); }
  shuffle(wrongAll).forEach(x=>{ if(wrong.length<G.L.n-1&&!wrong.includes(x)&&x.w[0]!==wrong[0]?.w[0]) wrong.push(x); });

// ---------- 기초 1~3단계: 다음 단어의 철자 완성 ----------
const GUIDED=m=>m==='spell'||m==='blocks'||m==='blanks';
// 다음에 올 단어: 컴퓨터 단어의 끝 글자로 시작, 글자 수 tMin~tMax, 컴퓨터가 이어 갈 수 있는 단어(기본 어휘 우선)
function chooseTarget(ch){
  const L=G.L, base=startsWith(ch,G.pool).filter(x=>/^[a-z]+$/.test(x.w)&&!NUMW.has(x.w));
  const fit=base.filter(x=>x.w.length>=L.tMin&&x.w.length<=L.tMax), goOn=fit.filter(x=>startsWith(last(x.w),G.cpuPool).length>0);
  return pickCore(goOn.length?goOn:fit.length?fit:base);
}
// 학생들이 자주 하는 철자 실수로 틀린 보기 만들기(첫 글자는 그대로): 모음 바꾸기, 끝 e 빼기·붙이기, 겹자음 빼기·넣기, 이웃 글자 순서 바꾸기
function misspellings(w,k){
  const V='aeiou', byRule=[[],[],[],[]], isV=c=>V.includes(c);
  for(let i=1;i<w.length;i++) if(isV(w[i])) for(const v of V) if(v!==w[i]) byRule[0].push(w.slice(0,i)+v+w.slice(i+1));
  byRule[1].push(w.endsWith('e')?w.slice(0,-1):w+'e');
  for(let i=1;i<w.length;i++){ if(w[i]===w[i-1]) byRule[2].push(w.slice(0,i)+w.slice(i+1)); else if(!isV(w[i])&&i<w.length-1) byRule[2].push(w.slice(0,i)+w[i]+w.slice(i)); }

  for(let r=0;out.length<k&&lists.some(l=>l.length);r=(r+1)%4){ const l=lists[r]; while(l.length){ const x=l.pop(); if(!out.includes(x)){ out.push(x); break; } } }
  for(let n=0;out.length<k&&n<200;n++){ const i=1+Math.floor(Math.random()*(w.length-1)), x=w.slice(0,i)+'bcdfghklmnprstvw'[Math.floor(Math.random()*16)]+w.slice(i+1); if(okW(x)&&!out.includes(x)) out.push(x); }
  return out;
}
// 자동 조절 단계(diff)별 난이도: 1단계 보기 수, 2단계 헷갈리는 글자 블록 수, 3단계 빈칸 수(첫 글자 + 1~3칸, 단어 길이의 절반까지)
const DIFF_MAX={spell:1,blocks:3,blanks:2};
const CONFUSE={b:'dp',d:'bp',p:'bq',q:'p',m:'n',n:'mu',u:'nv',v:'uw',w:'v',i:'el',e:'ia',a:'eo',o:'au',c:'k',k:'c',s:'c',g:'j',j:'g',l:'i',r:'l',t:'f',f:'t',h:'n',y:'i',x:'z',z:'s'};
function prepGuided(){
  const t=G.target, w=t.w, m=G.L.mode; G.reveal=0; G.placed=[]; G.blankVals={};
  if(m==='spell') G.options=shuffle([w,...misspellings(w,2+G.diff)]);
  if(m==='blocks'){ const extra=[]; for(let i=0;i<G.diff;i++){ const src=w[1+Math.floor(Math.random()*(w.length-1))]; const c=(CONFUSE[src]||'aeiou')[Math.floor(Math.random()*(CONFUSE[src]||'aeiou').length)]; extra.push(c); }
    G.blocks=shuffle([...w.slice(1),...extra].map((c,i)=>({c,i,used:false}))); }
  // 빈칸은 2칸 이상이고 첫 글자(컴퓨터 단어의 끝 글자)는 항상 빈칸
  if(m==='blanks'){ const n=Math.min(2+G.diff,Math.max(2,Math.floor(w.length/2))); G.blankIdx=[0,...shuffle([...Array(w.length).keys()].slice(1)).slice(0,n-1)].sort((a,b)=>a-b); }
}
// 연속 정답·오답에 따라 한 칸 어렵게/쉽게(같은 단계 안에서 유지)
function adapt(ok){
  if(!GUIDED(G.L.mode)) return; const A=SETTINGS.adapt, max=DIFF_MAX[G.L.mode];
  if(ok){ G.okRun++; G.badRun=0; if(G.okRun>=A.upAfter){ G.okRun=0; if(G.diff<max){ G.diff++; G.diffMove='up'; } } }
  else { G.badRun++; G.okRun=0; if(G.badRun>=A.downAfter){ G.badRun=0; if(G.diff>0){ G.diff--; G.diffMove='down'; } } }
}

  const ans=$app.querySelector('#answer'), t=G.target, w=t.w, m=G.L.mode;
  if(m==='spell'){
    ans.innerHTML=`<div class="choices spell n${G.options.length}">${G.options.map((o,i)=>`<button class="choice" data-v="${esc(o)}"><span class="w"><span class="f">${esc(o[0])}</span>${esc(o.slice(1))}</span></button>`).join('')}</div>`;
    ans.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(G.locked) return; b.classList.add(b.dataset.v===w?'right':'wrong'); guidedAnswer(b.dataset.v); });
    numberKeys(ans);
  }
  if(m==='blocks'){
    const draw=()=>{
      const filled=G.placed.map(p=>p.c);
      ans.innerHTML=`<div class="slots" style="--n:${w.length}" aria-label="완성할 단어">${slotHTML(w[0],'given')}${[...Array(w.length-1)].map((_,i)=>slotHTML(filled[i],filled[i]?'on':'')).join('')}</div>
        <div class="blocks" role="group" aria-label="글자 블록"><span class="tray-label">글자 블록을 순서대로 눌러요 <button class="linkbtn" id="undo" ${G.placed.length?'':'disabled'}>↶ 되돌리기</button></span>${G.blocks.map(b=>`<button class="blk" data-i="${b.i}" ${b.used?'disabled':''}>${esc(b.c)}</button>`).join('')}</div>`;
      ans.querySelectorAll('.blk').forEach(el=>el.onclick=()=>put(+el.dataset.i));
      ans.querySelector('#undo').onclick=undo;
    };
    const put=i=>{ if(G.locked) return; const b=G.blocks.find(x=>x.i===i); if(!b||b.used||G.placed.length>=w.length-1) return;
      b.used=true; G.placed.push(b); draw(); if(G.placed.length===w.length-1) guidedAnswer(w[0]+G.placed.map(p=>p.c).join('')); };
    const undo=()=>{ if(G.locked||!G.placed.length) return; G.placed.pop().used=false; draw(); };
    G.blockDraw=draw; draw();
    // 키보드: 글자 키(한글 자판이어도 자판 위치로) → 그 글자 블록, Backspace → 되돌리기
    setKeys(e=>{ if(e.key==='Backspace'){ e.preventDefault(); undo(); return; }
      const m2=/^Key([A-Z])$/.exec(e.code); if(!m2) return; const c=m2[1].toLowerCase(), b=G.blocks.find(x=>!x.used&&x.c===c); if(b){ e.preventDefault(); put(b.i); } });
  }
  if(m==='blanks'){
    // 빈칸 칸에 바로 글자를 씀: 한 칸을 채우면 다음 빈칸으로, Backspace로 앞 빈칸으로, Enter로 확인. 힌트로 다시 그려도 쓴 글자는 유지
    G.blankVals=G.blankVals||{};
    ans.innerHTML=`<form id="f" autocomplete="off"><div class="slots" id="bslots" style="--n:${w.length}" role="group" aria-label="빈칸이 있는 단어">${w.split('').map((c,i)=>G.blankIdx.includes(i)
        ?`<input class="slot bin${i===0?' first'+(G.blankVals[0]===c?' ok':''):''}" data-i="${i}" value="${esc(G.blankVals[i]||'')}" maxlength="2" lang="en" inputmode="email" name="${acName()}" autocomplete="${AC_OFF}" aria-autocomplete="none" data-lpignore="true" data-1p-ignore data-form-type="other" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${i?`${i+1}번째 글자(빈칸)`:'첫 글자(빈칸): 컴퓨터 단어의 끝 글자'}">`
        :slotHTML(c,i===0?'given':'fixed')).join('')}</div>
      <p class="note center">빈칸 ${G.blankIdx.length}칸을 채우고 Enter · 첫 칸은 끝 글자</p><div class="row"><button class="btn" type="submit">확인</button></div></form>`;
    const ins=[...ans.querySelectorAll('.bin')];
    // 철자 겹침 막기: 다음 칸으로는 이번 키 입력이 다 끝난 뒤에 옮기고(같은 키의 남은 입력이 다음 칸에 들어가지 않게),
    // 그래도 방금 다른 칸에 쓴 글자가 40ms 안에 이 빈칸에 또 들어오면 같은 키의 남은 입력으로 보고 버림(입력기·브라우저·운영체제와 관계없이)
    let lastPut=null;
    const fix=(el,e)=>{ if(e&&e.isComposing) return; const raw=el.value; const v=koToEn(raw).toLowerCase().replace(/[^a-z]/g,''), ch=v.slice(-1);
      if(ch&&lastPut&&lastPut.el!==el&&lastPut.ch===ch&&Date.now()-lastPut.t<40&&!G.blankVals[el.dataset.i]){ el.value=''; G.blankVals[el.dataset.i]=''; return; }
      el.value=ch; G.blankVals[el.dataset.i]=el.value;
      if(KO_RE.test(raw)) msg('한글 자판이에요. 한/영 키를 눌러 영어로 바꿔 주세요.','info');
      // 첫 글자 칸: 맞으면 연결선이 이어지고, 틀리면 끝 글자를 다시 보게 함(다음 칸으로 넘어가지 않음)
      if(el.dataset.i==='0'){ const good=el.value===w[0]; el.classList.toggle('ok',good&&!!el.value);
        if(el.value&&!good){ msg(FIRST_MSG,'info'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); el.select(); return; }
        if(good){ linkLand(); msg('','info'); } }
      // 터치 기기는 바로 옮김(아이폰은 setTimeout 안에서 초점을 옮기면 자판이 내려갔다 올라오며 화면이 흔들릴 수 있음). 실제 키보드(PC·크롬북)는 키 입력이 끝난 뒤에
      if(el.value){ lastPut={el,ch:el.value,t:Date.now()}; const nx=ins[ins.indexOf(el)+1];
        if(nx){ if(window.matchMedia&&matchMedia('(pointer:coarse)').matches) nx.focus({preventScroll:true}); else setTimeout(()=>{ if(document.activeElement===el) nx.focus({preventScroll:true}); },0); } } };
    ins.forEach(el=>{ el.addEventListener('input',e=>fix(el,e)); el.addEventListener('compositionend',()=>setTimeout(()=>fix(el),0));
      el.addEventListener('focus',()=>el.select());
      el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value){ const pv=ins[ins.indexOf(el)-1]; if(pv){ e.preventDefault(); pv.focus({preventScroll:true}); pv.value=''; G.blankVals[pv.dataset.i]=''; } } }); });
    ins.forEach(el=>engKeys(el,true));
    (ins.find(el=>!el.value)||ins[0])?.focus({preventScroll:true});
    ans.querySelector('#f').onsubmit=e=>{ e.preventDefault(); if(G.locked) return;
      if(ins.some(el=>!el.value)){ msg('빈칸을 모두 채워 주세요.','info'); (ins.find(el=>!el.value)).focus({preventScroll:true}); return; }
      const word=w.split('').map((c,i)=>G.blankIdx.includes(i)?ans.querySelector(`.bin[data-i="${i}"]`).value:c).join('');
      if(!DICT.has(word)&&isBlocked(word)){ ins.forEach(el=>{ el.value=''; G.blankVals[el.dataset.i]=''; }); blockedInput(ins[0]); return; }
      G.blankVals={}; guidedAnswer(word); };
  }
}

// 컴퓨터 단어의 끝 글자 → 다음 단어의 첫 글자(기초 1~3단계): 모든 화면에서 선 대신 handoff(끝 글자가 첫 글자 자리로 건너감)·land(닿은 칸 반짝임)
// 빈칸 채우기는 첫 글자를 맞게 채우면 컴퓨터 끝 글자와 첫 칸이 함께 반짝임(동작 줄이기 설정이면 생략)
const calm=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// 첫 글자 자리: 철자 고르기는 보기마다의 첫 글자, 글자 블록·빈칸 채우기는 첫 칸
const linkEnds=()=>G.L.mode==='spell'?[...$app.querySelectorAll('#answer .choice .f')]:[$app.querySelector('#answer .slots .slot')].filter(Boolean);
const flash=el=>{ clearTimeout(el._land); el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); el._land=setTimeout(()=>el.classList.remove('land'),650); };
// 새 컴퓨터 단어마다 끝 글자가 첫 글자 자리로 한 번 건너감. 빈칸 채우기는 답을 대신 채우지 않도록 글자 없이 동그라미만
function handoff(){
  if(calm()||!G||!GUIDED(G.L.mode)) return;
  const a=$app.querySelector('.cpu .big .last'); if(!a) return;
  const ra=a.getBoundingClientRect(), blank=G.L.mode==='blanks';
  linkEnds().forEach((b,i)=>{ const rb=b.getBoundingClientRect(), el=document.createElement('span');
    el.className='hand'+(blank?' dot':''); el.setAttribute('aria-hidden','true'); if(!blank) el.textContent=a.textContent;
    const sz=blank?Math.min(ra.width,ra.height,34):0;
    el.style.cssText=blank?`left:${ra.left+ra.width/2-sz/2}px;top:${ra.top+ra.height/2-sz/2}px;width:${sz}px;height:${sz}px`
      :`left:${ra.left}px;top:${ra.top}px;width:${ra.width}px;height:${ra.height}px;font-size:${getComputedStyle(a).fontSize}`;
    document.body.appendChild(el);
    const dx=rb.left+rb.width/2-(ra.left+ra.width/2), dy=rb.top+rb.height/2-(ra.top+ra.height/2), s=blank?1:Math.max(.4,Math.min(1,rb.height/ra.height));
    const end=()=>{ el.remove(); if(b.isConnected) flash(b); };
    if(!el.animate){ end(); return; }
    el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.45}px,${dy*.5-24}px) scale(1.05)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],
      {duration:750,delay:i*90,easing:'ease-in-out',fill:'forwards'}).finished.then(end,end);
  });
}
// 빈칸 채우기에서 첫 글자를 맞게 채우면: 컴퓨터 끝 글자와 첫 칸이 함께 반짝임
function linkLand(){ if(calm()) return; [$app.querySelector('.cpu .big .last'),...linkEnds()].forEach(e=>e&&flash(e)); }

// ---------- 휴대폰 화면 키보드 ----------
// 키보드가 올라오면(보이는 높이가 120px 넘게 줄면) html.kb로 화면을 줄이고, 브라우저가 입력칸을 보이려고 화면을 밀어 올린 것을 되돌림:
// 맨 위가 보이게 두되, 입력칸(과 확인 버튼)이 키보드에 가려지면 가려지지 않을 만큼만 올림. 아이폰·안드로이드 공통(visualViewport)
(()=>{ const vv=window.visualViewport; if(!vv) return;
  const root=document.documentElement; let full=0, wid=0, touchUntil=0, timer=0;
  const field=()=>{ const a=document.activeElement; return a&&a.tagName==='INPUT'&&/^(text|search|email)$/.test(a.type)&&$app.contains(a)?a:null; };
  // 아이폰·아이패드 사파리: 자판을 띄우면 주소창이 자판 바로 위에 떠서 보이는 영역(visualViewport)의 아래쪽을 가림 → 그만큼(IOS_BAR) 더 위로
  const IOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), IOS_BAR=64, pad=IOS?IOS_BAR:8;
  // 화면 떨림 막기: 같은 입력 묶음(빈칸 채우기 칸들·입력칸의 form)과 같은 보이는 높이에서는 한 번만 맞춤.
  // 칸을 옮길 때마다 브라우저(특히 아이폰 사파리)가 그 칸을 자판 위로 스크롤하는데, 그때마다 다시 맞추면 서로 밀고 당겨 위아래로 흔들림
  // 아이폰 사파리는 스크롤하면 주소창(도구 막대)이 줄었다 늘었다 하며 보이는 높이가 50~80px 바뀜 → 그 정도 변화에는 다시 맞추지 않음(BIG 이상일 때만: 키보드 오르내림·종류 바뀜)
  let pinned=null, kbH=0, kbUntil=0; const BIG=100;
  const pin=()=>{ const a=field(); if(!a||!root.classList.contains('kb')||Date.now()<touchUntil) return;
    const y=e=>e.getBoundingClientRect().bottom+scrollY+pad, form=a.closest('form')||a, cpu=$app.querySelector('.cpu');   // 문서 기준 아래끝(+가리는 바 높이)
    if(pinned&&pinned.form===form&&Math.abs(pinned.h-vv.height)<BIG) return;
    pinned={form,h:vv.height};
    // 확인 버튼까지 보이게 하되, 그러려면 컴퓨터 단어 카드가 가려지는 아주 작은 화면에서는 입력칸까지만(확인은 키보드의 Enter)
    // 이미 필요한 곳(컴퓨터 단어 카드 위쪽, 입력칸)이 다 보이면 건드리지 않음 — 칸을 옮길 때마다 브라우저의 스크롤과 다투면 화면이 떨림
    // 화면이 바뀌며 브라우저가 스크롤을 그대로 두어 맨 윗줄만 가려진 경우는, 필요한 곳이 보여도 덜 내린 자리로 한 번 되돌림
    const seen=(cpu?cpu.getBoundingClientRect().top>=vv.offsetTop-1:true)&&form.getBoundingClientRect().bottom<=vv.offsetTop+vv.height-pad+8;
    const head=$app.querySelector('.ghead,.topbar'), headSeen=!head||head.getBoundingClientRect().top>=vv.offsetTop-1;
    if(seen&&headSeen) return;
    let want=Math.max(0,y(form)-vv.height); const cap=cpu?cpu.getBoundingClientRect().top+scrollY-4:Infinity;
    if(want>cap) want=Math.max(cap,y(a.closest('.slots')||a)-vv.height);
    const now=scrollY+vv.offsetTop;
    if(seen&&want>=now-2) return;
    if(Math.abs(want-now)>2) scrollTo(0,want-vv.offsetTop); };
  const update=e=>{
    if(innerWidth!==wid){ wid=innerWidth; full=0; }                                  // 회전하면 기준 높이를 다시 잼
    full=Math.max(full,vv.height);
    // 터치 화면에서만(컴퓨터 창 크기 바꾸기 제외), 두 손가락으로 확대한 때는 제외
    const on=!!field()&&full-vv.height>120&&Math.abs((vv.scale||1)-1)<.05&&!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
    if(on!==root.classList.contains('kb')){ root.classList.toggle('kb',on); kbH=0; kbUntil=Date.now()+450; if(!on&&scrollY>0&&$app.querySelector('.status')) scrollTo(0,0); }   // 키보드가 내려가면 게임 화면은 맨 위로
    root.style.setProperty('--vvt',vv.offsetTop+'px');
    // 아래 여백(키보드 높이)은 키보드가 올라오는 동안(0.45초)만 늘리고, 그 뒤로는 크게(BIG 이상) 바뀔 때만 — 주소창 때문에 높이가 바뀔 때마다 문서 높이가 바뀌면 화면이 흔들림
    if(on){ const h=Math.round(full-vv.height); if(h>kbH&&(Date.now()<kbUntil||!kbH||h-kbH>=BIG)){ kbH=h; root.style.setProperty('--kbh',kbH+'px'); } } else pinned=null;
    clearTimeout(timer); pin();
    if(e&&e.type==='resize'&&on&&(!pinned||Math.abs(vv.height-pinned.h)>=BIG||Date.now()<kbUntil)) timer=setTimeout(()=>{ pinned=null; pin(); },250); };   // 키보드가 오르내리면 다 움직인 뒤 한 번 더(그때는 다시 맞춤)
  // 브라우저가 스크롤만 한 때(visualViewport scroll)는 위치 값만 고치고 다시 맞추지 않음
  vv.addEventListener('resize',update); vv.addEventListener('scroll',()=>root.style.setProperty('--vvt',vv.offsetTop+'px'));
  addEventListener('focusin',()=>setTimeout(update,50)); addEventListener('focusout',()=>setTimeout(update,80));
  // 학생이 직접 화면을 끌어 볼 때는 되돌리지 않음
  addEventListener('touchmove',()=>{ touchUntil=Infinity; },{passive:true});
  addEventListener('touchend',()=>{ if(touchUntil===Infinity) touchUntil=Date.now()+1200; },{passive:true});
  update();
})();

// ---------- 별로 사기 버튼 ----------
const buyBtnHTML=(id,price,label)=>`<button class="btn buy" id="${id}" ${stars<price?'disabled':''} title="${stars<price?`별이 부족해요 (⭐ ${stars}/${price})`:''}">${label} · ⭐${price}${stars<price?` <small>(⭐ ${stars}/${price})</small>`:''}</button>`;
const hintPrice=()=>{ const p=SETTINGS.shop.hintPrice; return typeof p==='number'?p:(p[track]||5); };
// 보관 힌트: wordchain-v2 수준별 진도 안(prog.<수준>.storedHints)에 개수만 저장 → '이 수준 기록 지우기'로 함께 지워짐
const storedHints=()=>save.storedHints||0;
function setStored(n){ save.storedHints=Math.max(0,Math.min(SETTINGS.shop.maxStored,n)); persist(); }
const storeRoom=()=>SETTINGS.shop.maxStored-storedHints();
const canUseStored=()=>storedHints()>0&&(G.usedStored||0)<SETTINGS.shop.maxUsePerRun;
const canHint=()=>G.hints>0||canUseStored();
function consumeHint(){ if(G.hints>0){ G.hints--; return; } setStored(storedHints()-1); G.usedStored=(G.usedStored||0)+1; }
function hintBtnHTML(){
  const st=storedHints(), cap=SETTINGS.shop.maxStored, max=SETTINGS.shop.maxUsePerRun;
  let h=`<span class="buywrap"><button class="btn hint" id="hintBtn" ${canHint()?'':'disabled'}>💡 힌트</button><small class="hcount">무료 💡 ${G.hints} · 보관 💡 ${st}</small>`;
  if(G.hints<=0&&st>0&&(G.usedStored||0)>=max) h+=`<small class="lack">보관 힌트는 한 번 도전에 ${max}번까지 써요</small>`;
  if(G.hints>0) return h+'</span>';
  if(storeRoom()<=0) return h+`<button class="btn hint buy" id="buyHint" disabled>⭐ 보관 힌트 사기</button><small class="lack">보관 힌트가 가득 찼어요 (${st}/${cap})</small></span>`;
  if(stars<hintPrice()) return h+`<button class="btn hint buy" id="buyHint" disabled>⭐ 보관 힌트 사기</button><small class="lack">별이 부족해요 (⭐ ${stars}/${hintPrice()})</small></span>`;
  return h+`<button class="btn hint buy" id="buyOpen" aria-expanded="${!!G.buyOpen}">⭐ 보관 힌트 사기</button></span>`;
}
// 사기 버튼을 누르면 상태 줄 아래에 한 줄로 펼침: 개수 고르기 · 사기 · 닫기
const buyRowHTML=()=>G.buyOpen&&G.hints<=0&&storeRoom()>0&&stars>=hintPrice()?`<div class="buyrow" role="group" aria-label="보관 힌트 사기">${buyHTML()}<button class="linkbtn" id="buyClose">닫기</button></div>`:'';
function buyHTML(){
  const room=storeRoom(), price=hintPrice(), q=Math.max(1,Math.min(G.buyQty||1,room)), cost=price*q, lack=stars<cost;
  return `<span class="qty" role="group" aria-label="살 보관 힌트 개수">${room>1?`<button class="tbtn" id="qMinus" aria-label="하나 적게" ${q<=1?'disabled':''}>−</button>`:''}<span>힌트 <b id="qN">${q}</b>개</span>${room>1?`<button class="tbtn" id="qPlus" aria-label="하나 더" ${q>=room?'disabled':''}>+</button>`:''}</span>
    <button class="btn hint buy" id="buyHint" ${lack?'disabled':''}>⭐ ${cost}개로 사기</button>${lack?`<small class="lack">별이 부족해요 (⭐ ${stars}/${cost})</small>`:''}`;
}
function bindHintBtn(){
  const hb=$app.querySelector('#hintBtn'); if(hb&&!hb.disabled) hb.onclick=useHint;
  const keepRender=()=>{ const keep=$app.querySelector('#inp')?.value||''; render(); const ip=$app.querySelector('#inp'); if(ip) ip.value=keep; };
  $app.querySelector('#buyOpen')?.addEventListener('click',()=>{ G.buyOpen=true; keepRender(); });
  $app.querySelector('#buyClose')?.addEventListener('click',()=>{ G.buyOpen=false; keepRender(); });
  const redraw=()=>{ const w=$app.querySelector('.buyrow'); if(w){ w.outerHTML=buyRowHTML(); bindHintBtn(); } };
  $app.querySelector('#qMinus')?.addEventListener('click',()=>{ G.buyQty=Math.max(1,(G.buyQty||1)-1); redraw(); });

  armBuy($app.querySelector('.buyrow #buyHint'),hintPrice()*q,'',()=>{ setStored(storedHints()+q); G.buyQty=1; G.buyOpen=false;
    const keep=$app.querySelector('#inp')?.value||''; render(); const inp=$app.querySelector('#inp'); if(inp) inp.value=keep;

// ---------- 콤보·점수·배지 ----------
function calcScore(o,combo,listen,hint,inNb){
  const S=SETTINGS.score, n=o.w.length; let bonus=0;
  if(n>=S.lenFrom) bonus+=(n-S.lenFrom+1)*S.lenPer;
  if(o.core===2) bonus+=S.core2; else if(o.core===1) bonus+=S.core1;   // 기본 어휘 보너스
  if(inNb) bonus+=S.notebookBonus;                         // 수첩 단어(외운 단어 제외)를 정답으로 쓰면
  if(hint) bonus=0;                                          // 힌트를 쓴 턴은 길이·기본 어휘 보너스만 없어짐
  const mult=(S.combo.find(([c])=>combo>=c)||[0,1])[1]*(listen?S.listen:1);
  return Math.floor((S.base+bonus+(o.outside?S.outside:0))*mult);
}
const scoreFor=(o,inNb)=>calcScore(o,G.combo,G.listen,G.turnHint,inNb);
function checkBadges(o){
  award('first');
  if(G.combo>=B.fire[0]) award('fire5'); if(G.combo>=B.fire[1]) award('fire10');
  if(o.w.length>=B.longWord) award('long');
  const st=stat();
  if(o.core&&!o.outside&&!st.tb.includes(o.w)){ st.tb.push(o.w); persist(); }
  if(st.tb.length>=B.core[0]) award('tb10'); if(st.tb.length>=B.core[1]) award('tb30');
  if(o.outside){ st.outside++; persist(); if(st.outside>=B.outside) award('outside'); }
  if(G.failedBefore&&G.combo>=B.comeback) award('comeback');
  if(G.listen){ G.listenRun++; if(G.listenRun>=B.ears) award('ears'); } else G.listenRun=0;
}

function celebrate(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el=document.createElement('div'); el.className='burst'; el.setAttribute('aria-hidden','true'); el.textContent=`🔥 ${n}콤보! 🎉`;

function pickChoice(i,btn){

  else { btn.classList.add('wrong'); speak(o.w); const r=G.options.find(x=>x.w[0]===last(G.cur.w)); fail(`<b>${esc(disp(o))}</b>는 <b>${esc(o.w[0])}</b>로 시작해요.`, r); }

function submitTyped(raw){
  if(G.locked) return;
  const w=raw.trim().toLowerCase(); const ch=last(G.cur.w); const inp=$app.querySelector('#inp');
  if(!w){msg('단어를 입력하세요.','info');return;}
  if(!/^[a-z]+$/.test(w)){msg('영어 알파벳만 써 주세요.','info');return;}
  if(!DICT.has(w)&&isBlocked(w)){ blockedInput(inp); return; }
  if(DICT.has(w)&&(w[0]!==ch||G.used.has(w))) speak(w);
  if(w[0]!==ch){ G.silent=G.listen&&!G.revealed?silentNote(G.cur.w,w[0]):''; fail(`<b>${esc(w)}</b>는 <b>${esc(w[0])}</b>로 시작해요. <b>${esc(ch)}</b>로 시작해야 해요.`, example(ch)); return; }
  if(G.used.has(w)){ const k=G.chain.findIndex(x=>x.w===w); const who=k>=0?(G.chain[k].me?'내가':'컴퓨터가'):'';
    fail(`<b>${esc(w)}</b>는 이번 끝말잇기에서 ${k>=0?`${k+1}번째에 ${who} `:''}이미 쓴 단어예요. 위의 단어 줄에서 확인해 보세요.`, example(ch)); return; }
  if(w.length<G.L.min){ msg(`${G.L.min}글자 이상 단어를 써 주세요.`,'info'); inp.select(); return; }
  const d=DICT.get(w);
  if(d){ success(d); return; }
  // 단어장 밖이지만 올바른 영어 단어: 정답(뜻은 표시하지 않음)
  if(isEnglish(w)){ success({w,ko:'',outside:true}); return; }
  // 틀린 단어: 철자 도움을 보여 주고 다시 쓸 기회(SETTINGS.wrongRetry번), 그다음은 오답
  const sug=suggest(w); G.wrongTries=(G.wrongTries||0)+1;
  if(G.wrongTries<=SETTINGS.wrongRetry){
    msg(`"${w}"는 영어 단어 목록에 없어요. ${sug.length?`혹시 이 단어인가요? ${sug.join(' · ')}`:'철자를 다시 확인해 보세요.'} 한 번 더 써 보세요.`,'bad');
    inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.select(); return; }
  fail(`<b>${esc(w)}</b>는 영어 단어 목록에 없어요.${sug.length?` 혹시 <b>${sug.map(esc).join(' · ')}</b>?`:''}`, example(ch));
}
function example(ch){ const c=startsWith(ch,G.pool); return c.length?pickCore(c):null; }
function success(o){
  G.locked=true; stopTimer(); G.turns++; G.rights++; const spoken=speak(o.w); G.used.add(o.w);
  const wasHidden=G.listen&&!G.revealed;   // 듣고 쓰기: 이번 답으로 컴퓨터 단어를 공개함
  const inNb=!o.outside&&nbShown(nb.items[o.w]);   // 수첩 단어인지는 이번 정답으로 수첩에 모으기 전에 확인
  adapt(true); if(G.clean) G.cleanRun++;
  G.combo++; G.bestCombo=Math.max(G.bestCombo,G.combo); const pts=scoreFor(o,inNb); G.score+=pts;
  save.bestScore=save.bestScore||{}; if(G.score>(save.bestScore[G.L.id]||0)){ save.bestScore[G.L.id]=G.score; persist(); }
  checkBadges(o);
  const sc=$app.querySelector('#score'), cb2=$app.querySelector('#combo');
  if(sc) sc.textContent=`${G.score}점`; if(cb2) cb2.textContent=G.combo>=SETTINGS.combo.show?` · 🔥 ${G.combo}콤보`:'';
  if(SETTINGS.combo.celebrate.includes(G.combo)) celebrate(G.combo);
  if(o.core&&!o.outside&&!nb.tbSeen.includes(o.w)){ nb.tbSeen.push(o.w); nbSave(); } G.chain.push({w:o.w,d:disp(o),me:true}); G.feed.push({w:o.w,d:disp(o),me:true}); G.streak++;
  if(G.streak>(save.best[G.L.id]||0)){save.best[G.L.id]=G.streak;persist();}
  drawStatus();
  if(G.listen&&!G.revealed){ G.revealed=true; G.myWord=disp(o); G.okNote=silentNote(G.cur.w,o.w[0]); render(); const cpuCard=$app.querySelector('.cpu .who'); if(cpuCard) cpuCard.textContent='🎧 컴퓨터가 읽은 단어'; }
  msg((o.outside?`좋아요! ${disp(o)} — 📗 단어장 밖 단어`:`좋아요! ${disp(o)} = ${o.ko}`)+(inNb?' 📒 수첩 단어!':'')+` (+${pts}점)`,'good');
  const g=G, P=SETTINGS.pace[track]||SETTINGS.pace.basic;
  const hold=wasHidden?(G.L.listen==='force'?SETTINGS.listen.challengeRevealHold:SETTINGS.listen.revealHold):0;   // 듣고 쓰기로 공개한 컴퓨터 단어를 보여 주는 여유
  // 잠깐 뒤 문제 창을 감추고 내 말풍선이 채팅에 올라오게(듣고 쓰기는 공개한 컴퓨터 단어를 보여 줘야 하므로 그대로)
  if(!wasHidden&&!phoneUI()) setTimeout(()=>{ if(G===g&&G.locked&&!REST){ away(true); syncFeed(); } },AWAY_MS);
  // 마지막 정답: 통과는 바로 기록하고, 통과 화면은 잠시 뒤에. 듣고 쓰기면 다른 문제처럼 학생 단어를 다 읽고 쉰 뒤 공개 여유까지 보여 줌(그사이 다른 화면으로 가면 통과 화면은 띄우지 않음)
  if(G.streak>=G.L.goal){ recordPass(); (wasHidden?spoken.then(()=>wait((soundOn?P.after:0)+hold)):wait(AWAY_MS+500)).then(()=>{ if(G===g&&$app.querySelector('#hintArea')) startRest(); }); return; }
  // 학생 단어를 다 읽고 쉰 뒤에 컴퓨터 단어로(SETTINGS.pace: 모든 수준 1초·최소 2초)
  Promise.all([spoken.then(()=>wait((soundOn?P.after:0)+hold)),wait(P.gap)]).then(()=>{ if(G!==g) return;
    const next=pickCpu(last(o.w));
    if(!next){ toast('🤖','컴퓨터가 졌어요!',`컴퓨터가 <b>${esc(last(o.w))}</b>로 시작하는 단어를 못 찾았어요. 새 단어로 다시 시작해요.`,'계속',()=>{G.used.clear();archiveChain();feedDivider();setCpu(pickCpu(null));}); return; }
    setCpu(next);
  });
}
function fail(why,ex){
  G.locked=true; stopTimer(); G.turns++;
  if(ex) nbAdd(ex.w,'wrong');
  adapt(false); G.clean=false; G.cleanRun=0; G.failedBefore=true; const r=loseTurn(); drawStatus();
  let revealHTML='';
  if(G.listen&&!G.revealed){ G.revealed=true; render(); revealHTML=`<p>🎧 컴퓨터 단어는 <span class="ex">${esc(disp(G.cur))}</span> (${esc(plainKo(G.cur.ko))})였어요.</p>${G.silent?`<p class="snote miss" id="missNote">💡 ${esc(G.silent)}</p>`:''}`; }
  const exHTML=ex?`<p>이런 단어가 있어요: <span class="ex">${esc(disp(ex))}</span> (${esc(ex.ko)}) ${ex.emoji||''}</p>`:'';
  const gf=G; setTimeout(()=>G===gf&&toast('😵','아쉬워요!',`<p>${why}</p>${revealHTML}${exHTML}${r.text}`,r.label,r.next),450);
}
// 단계 통과 기록(진도·배지·별). 통과 화면(startRest)은 success()에서 잠시 뒤에 띄움
function recordPass(){
  const L=G.L; save.cleared[L.id]=true; if(save.unlocked<L.id+1) save.unlocked=Math.min(LEVELS.length,L.id+1); persist();
  if(!G.hintUsed) award('nohint');
  if(LEVELS.every(x=>save.cleared[x.id])) award('master-'+track);
  bankStars();
}

// ---------- 단계 통과 뒤(코드 이름 REST, 게임 화면 그대로): ① 결과 요약(3초 뒤 저절로 닫힘) → ② 주고받은 단어 다시 보기 → 다음 ▶ → ③ 🎁 선물 상자(저절로 열리고 닫힘) → ④ 단계 맵으로 가기 · 다음 단계로 가기 ----------
let REST=null, boxRoll=null;   // boxRoll: 테스트용으로 다음 금상자의 보관 힌트 뽑기 결과를 정함(0~1)
const fmtTime=ms=>{ const t=Math.max(0,Math.round(ms/1000)), m=Math.floor(t/60), x=t%60; return m?`${m}분 ${x}초`:`${x}초`; };
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// 상자 등급: 하트를 하나도 잃지 않았거나(기초는 한 번도 안 틀림) 힌트 없이 통과 → 금, 하트 1개 잃음 → 은, 그 외 → 동
const GRADES={gold:{icon:'🥇',name:'금상자'},silver:{icon:'🥈',name:'은상자'},bronze:{icon:'🥉',name:'동상자'}};
const boxGrade=(lost,noHint)=>lost===0||noHint?'gold':lost===1?'silver':'bronze';
function startRest(){
  stopTimer(); offKeys();
  const L=G.L, nextL=LEVELS[L.id], lost=livesOn()?(G.livesLost||0):G.turns-G.rights;
  REST={L,nextL,step:1,stars:G.starsGot||0,turns:G.turns,rights:G.rights,ms:Date.now()-G.t0,score:G.score,bestCombo:G.bestCombo,
    noHint:!G.hintUsed,badges:G.newBadges.map(id=>BADGES.find(b=>b.id===id)).filter(Boolean),
    skip3:track==='basic'&&L.id===1&&G.firstTime&&G.clean&&G.cleanRun>=Math.min(SETTINGS.skipStreak,L.goal)&&LEVELS.length>=3,
    // 다시 보기: 이번 단계에서 이어 간 단어 모두(틀려서 새로 시작한 줄은 '새로 시작' 표시로 나눔). 틀린 시도와 대답하지 못한 컴퓨터 단어는 없음
    lost,grade:boxGrade(lost,!G.hintUsed),hl:[...G.lines,G.chain].flatMap((seg,k)=>[...(k?[{div:true}]:[]),...seg.map(x=>({w:x.w,d:x.d||x.w,me:!!x.me}))]),shown:0,opened:false,reward:null};
  if($app.querySelector('#gscreen')?._g!==G) gameShell();
  away(true); const gb=$app.querySelector('#gbody'); gb.classList.add('resting');
  const layer=document.createElement('section'); layer.className='restlayer'; layer.id='rest'; gb.appendChild(layer);
  renderRest();
}
function renderRest(){
  const S=REST, box=$app.querySelector('#rest'); if(!S||!box) return;
  clearTimeout(S.tm); [restSummary,restShow,restBox,restFinal][S.step-1](box);
}
const restGo=step=>{ if(!REST) return; REST.step=step; renderRest(); };
// 화면을 누르거나 Enter를 누르면 fn(한 번만). 다른 단계로 넘어가면 저절로 풀림
// 바로 등록해도 지금 처리 중인 누르기·Enter에는 불리지 않음(document 캡처 단계는 이미 지났거나 목록이 정해져 있음)
function restTap(S,step,fn){
  const off=()=>{ document.removeEventListener('keydown',onKey,true); document.removeEventListener('click',onClick,true); };
  const alive=()=>REST===S&&S.step===step&&!!$app.querySelector('#rest');
  // 다시 보기 중 말풍선(철자)을 누르거나 그 위에서 Enter → 그 단어를 읽기만 하고 넘어가지 않음
  const onWord=e=>e.target&&e.target.closest&&e.target.closest('#fl .hb');
  const onKey=e=>{ if(!alive()) return off(); if(e.key==='Enter'){ if(onWord(e)) return; e.preventDefault(); e.stopPropagation(); off(); fn(); } };
  const onClick=e=>{ if(!alive()) return off(); if(e.target.closest('.ghead')||onWord(e)) return; e.preventDefault(); e.stopPropagation(); off(); fn(); };
  document.addEventListener('keydown',onKey,true); document.addEventListener('click',onClick,true);
  return off;
}
// ① 결과 요약(가운데 창): 받은 별·정답률·걸린 시간, 점수·최고 콤보, 이번에 얻은 배지, 힌트 없이 통과 축하. summaryHold(3초) 뒤 저절로 닫힘(누르거나 Enter면 바로)

    <p>${livesOn()?`하트를 다 잃기 전에 ${L.goal}번 성공했어요.`:`틀리지 않고 ${L.goal}번 연속 성공했어요.`}</p>

// ② 주고받은 단어 다시 보기: 채팅을 비우고 처음부터 말풍선이 아래에서 하나씩(gap 간격) 올라옴. 누르거나 Enter면 전부 바로
// 동작 줄이기 설정이어도 하나씩 차례로 나오게 하고 올라오는 움직임만 뺌(rise가 건너뜀)
// 다 나오면 가운데에 "다음 ▶". 말풍선을 누르면 그 단어를 읽어 줌
function restShow(box){

  // 말풍선을 누르면 읽기(다시 보기 중에도, 이미 나온 말풍선이면). "다음 ▶"이 나온 뒤에는 화면 전체 딤드가 덮어 눌리지 않음
  fl.querySelectorAll('.hb').forEach(b=>b.onclick=()=>{ if(b.closest('li.wait')) return; audioKeepAlive(true); const o=soundOn; soundOn=true; speak(S.hl[+b.dataset.i].w); soundOn=o; });
  const alive=()=>REST===S&&S.step===2&&$app.querySelector('#fl')===fl;
  let off=()=>{};
  const finish=()=>{ clearTimeout(S.tm); off(); if(!alive()) return; S.shown=n; fl.querySelectorAll('li.wait,li.up').forEach(li=>li.classList.remove('wait','up'));   // 올라오던 말풍선도 바로 제자리에
    const tip=box.querySelector('#hlTip'); if(tip) tip.textContent='말풍선을 누르면 단어를 읽어 줘요.';
    if(!box.querySelector('#go')){ const b=document.createElement('button'); b.className='btn big restnext pop'; b.id='go'; b.textContent='다음 ▶'; box.appendChild(b); b.onclick=()=>restGo(3); b.focus({preventScroll:true}); } };
  if(S.shown>=n){ finish(); return; }
  off=restTap(S,2,finish);
  const step=()=>{ if(!alive()) return finish(); const li=fl.children[S.shown]; li.classList.remove('wait'); rise(li);
    S.shown++; S.tm=setTimeout(S.shown>=n?finish:step,S.shown>=n?SETTINGS.restBox.rise:SETTINGS.restBox.gap); };
  step();

// ③ 🎁 선물 상자(저절로): 등급 상자가 흔들리다 열려 보상을 보여 주고(giftShake → giftShow) 저절로 닫힘. 누르거나 Enter면 다음으로 빨리
function restBox(box){

    box.innerHTML=`<div class="qmodal rcard gift-card pop" role="dialog" aria-label="선물 상자">

      :`<div class="gift open" aria-hidden="true">${r.extra==='hint'?'💡':'⭐'}</div>
      <p class="sum" id="reward">${g.icon} ${g.name}에서 ⭐ ${r.stars}개를 받았어요!</p>
      ${r.extra?`<p class="sum" id="bonus">${r.extra==='hint'?`💡 보관 힌트 ${r.hint}개도 들어 있었어요! (${TRACKS[track].name} 수준에서 써요)`:`💡 보관 힌트가 가득 차서 ⭐ ${r.hintStars}개로 바꿔 줬어요!`}</p>`:''}
      <p class="sum">모은 별 ⭐ <b class="stars-n">${stars}</b></p>`}</div>`; };
  let off=()=>{};

    const c=box.querySelector('.gift-card'); if(c&&!reduceMotion()){ c.classList.add('closing'); S.tm=setTimeout(()=>restGo(4),300); } else restGo(4); };

// 상자 열기: 등급별 별 + 금상자는 hintChance% 확률로 보관 힌트(가득 찼거나 보관 기능이 없으면 별 fullHintStars개)
function openBox(){

  if(o.hintChance&&(boxRoll!=null?boxRoll:Math.random())*100<o.hintChance){

    else { setStars(stars+RB.fullHintStars); extra='hintStars'; } }
  boxRoll=null;
  S.opened=true; S.reward={grade:S.grade,stars:o.stars,extra,hint:o.hint||1,hintStars:RB.fullHintStars};

// ④ 마지막: "단계 맵으로 가기" · "다음 단계로 가기"(다음 단계 규칙 창 → 시작). 수준의 마지막 단계면 정복 + "다른 수준 고르기"

    <div class="row"><button class="btn soft" id="toList">🗺 단계 맵으로 가기</button>${N?`<button class="btn" id="startNext">▶ 다음 단계로 가기</button>`:'<button class="btn" id="toTracks">🏠 다른 수준 고르기</button>'}</div>
    ${S.skip3?'<button class="btn soft" id="skip3">🚀 3단계로 바로 가기</button>':''}

function toast(e,title,body,label,fn,label2,fn2){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card pop" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="big-e">${e}</div><h3>${title}</h3><div>${body.startsWith('<')?body:'<p>'+body+'</p>'}</div>
    <div class="row">${label2?`<button class="btn soft" id="ov2">${label2}</button>`:''}<button class="btn" id="ov1">${label}</button></div></div>`;
  document.body.appendChild(ov);
  const b1=ov.querySelector('#ov1'); b1.focus();
  b1.onclick=()=>{ov.remove();fn();};

// ---------- 힌트 ----------
function useHint(){
  if(G.locked||!canHint()) return;
  const ch=last(G.cur.w);
  if(GUIDED(G.L.mode)){
    const w=G.target.w, m=G.L.mode;
    if(m==='spell'){ if(G.reveal>=w.length-2){ msg('더 보여 줄 글자가 없어요. 골라 보세요!','info'); return; } G.reveal++; }
    if(m==='blocks'){ if(G.reveal>=w.length-2){ msg('더 보여 줄 글자가 없어요.','info'); return; }
      G.reveal++; G.placed.forEach(p=>p.used=false); G.placed=[];
      for(let k=1;k<=G.reveal;k++){ const b=G.blocks.find(x=>!x.used&&x.c===w[k]); if(b){ b.used=true; G.placed.push(b); } } }
    if(m==='blanks'){ if(G.blankIdx.length<=1){ msg('첫 글자 빈칸은 직접 채워 보세요! 컴퓨터 단어의 끝 글자를 봐요.','info'); return; } G.blankIdx.splice(1,1); G.reveal++; }
    nbAdd(w,'hint'); G.clean=false; G.hintUsed=true; G.turnHint=true; consumeHint(); G.hintStep++;
    const keepPlaced=G.placed; render(); G.placed=keepPlaced; if(G.blockDraw&&m==='blocks') G.blockDraw();
    msg('💡 한 글자를 더 보여 줬어요.','info'); return;
  }
  // 듣고 쓰기·듣기 챌린지(단어가 아직 안 보일 때): 시작 글자 대신 끝 글자를 찾을 단서. ① 끝에서 두 번째 글자와 위치 ② 뜻
  if(G.listen&&!G.revealed){
    if(G.hintStep>=LISTEN_HINTS){ msg('이 단어에 쓸 수 있는 힌트를 다 봤어요.','info'); return; }
    G.hintUsed=true; G.clean=false; G.turnHint=true; consumeHint(); G.hintStep++;
    const keep=$app.querySelector('#inp')?.value||''; render(); const inp=$app.querySelector('#inp'); if(inp) inp.value=keep;
    return;
  }
  G.hintUsed=true; G.clean=false; G.turnHint=true;
  if(G.L.mode==='choice'){
    const wrongs=G.options.filter(o=>o.w[0]!==ch&&!G.removed.has(o.w));
    if(wrongs.length<=1&&G.hintStep>0){ msg('이미 힌트를 썼어요. 남은 2개 중에서 골라 보세요!','info'); return; }
    // 오답을 지워 2개만 남기기
    shuffle(wrongs).slice(0,wrongs.length-1).forEach(o=>G.removed.add(o.w));
  }else{
    const maxStep=3;
    if(G.hintStep>=maxStep){ msg('이 단어에 쓸 수 있는 힌트를 다 봤어요.','info'); return; }
    if(!G.hintWord||G.hintWord.w[0]!==ch||G.used.has(G.hintWord.w)) G.hintWord=pickCore(startsWith(ch,G.pool).filter(x=>x.w.length>=G.L.min));
    if(G.hintWord) nbAdd(G.hintWord.w,'hint');
    if(G.L.time){ G.bonus=Math.min(G.bonus+5,G.elapsed); G.timeLeft=G.lim+G.bonus-G.elapsed; }
  }
  consumeHint(); G.hintStep++;
  const keep=$app.querySelector('#inp')?.value||'';
  render();
  const inp=$app.querySelector('#inp'); if(inp){inp.value=keep;}
}
// 듣기 힌트 ①: 끝에서 두 번째 글자만 위치와 함께(write → □ □ □ t □), 마지막 칸은 맞힐 칸
const LISTEN_HINTS=2;
const penPattern=w=>w.split('').map((c,i)=>i===w.length-2?c:'□').join(' ');
function showHint(){
  const area=$app.querySelector('#hintArea'); const ch=last(G.cur.w);
  if(G.listen&&!G.revealed){
    const c=G.cur, w=c.w, k=w.length, n=G.hintStep;
    area.innerHTML=`<div class="hintbox lhint">
      <div class="lboxes pen" id="penHint" role="img" data-pat="${esc(penPattern(w))}" aria-label="${k}글자 단어, 끝에서 두 번째 글자는 ${esc(w[k-2])}. 마지막 칸의 글자를 맞혀요">${w.split('').map((x,i)=>`<span class="lbox${i===k-2?' on':i===k-1?' qbox':''}" aria-hidden="true">${i===k-2?esc(x):i===k-1?'?':''}</span>`).join('')}</div>
      <div class="askcap"><span class="lbox qbox mini" aria-hidden="true">?</span> 이 글자를 맞혀요</div>
      <div id="penMsg">끝에서 두 번째 글자예요. 마지막 글자는 무엇일까요?</div>
      ${n>=2?`<div id="hintKo">뜻: <b>${esc(plainKo(c.ko))}</b></div>`:'<small>힌트를 한 번 더 쓰면 뜻을 보여 줘요.</small>'}
      <div><button class="speak" id="slowSay">🐢 천천히 듣기</button></div></div>`;
    area.querySelector('#slowSay').onclick=()=>{ audioKeepAlive(true); speak(c.w,false,SETTINGS.listen.slowRate); $app.querySelector('#inp')?.focus({preventScroll:true}); };
    return;
  }
  if(G.L.mode==='choice'){ area.innerHTML=`<div class="hintbox">💡 틀린 보기를 지웠어요. <b>${ch}</b>로 시작하는 단어를 찾아보세요!</div>`; return; }
  const h=G.hintWord; if(!h) return;
  const shown=G.hintStep; // 1: 뜻 + 첫 글자, 2: 두 글자, 3: 세 글자
  const pat=disp(h).split('').map((c,i)=>i<shown?c:'_').join(' ');
  // 힌트 뜻에서는 접미사 단어의 원래 단어 표시(예: kindly의 "(kind+ly)")를 뺌 — 답을 알려 주는 셈이라
  area.innerHTML=`<div class="hintbox">💡 <b>${esc(plainKo(h.ko))}</b> ${h.emoji||''} — ${h.w.length}글자${G.L.time?' (+5초)':''}<div class="pat word">${esc(pat)}</div>${shown<3?'<small>힌트를 한 번 더 쓰면 글자가 하나 더 보여요.</small>':''}</div>`;
}

// ---------- 타이머 ----------
function startTimer(){
  stopTimer(); let lastTick=Date.now();
  timerId=setInterval(()=>{
    const now=Date.now(); G.elapsed+=(now-lastTick)/1000; lastTick=now; G.timeLeft=G.lim+G.bonus-G.elapsed;
    const bar=$app.querySelector('#tbar');
    if(bar){bar.firstElementChild.style.width=Math.max(0,G.timeLeft/G.lim*100)+'%'; bar.classList.toggle('warn',G.timeLeft<6);}
    if(G.timeLeft<=0){ stopTimer(); fail('⏰ 시간이 다 됐어요.', example(last(G.cur.w))); }
  },200);
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }

chooseTrack();
})();
</script>
