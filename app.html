<title>Word Chain Challenge</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6e7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="끝말잇기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 게임 — 위에 진행 상태, 가운데 컴퓨터 단어 카드, 아래에 답 영역. 단어들은 "기차 칸"처럼 이어짐 */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface-2:#e2eaf0; --ink:#17323f; --muted:#5b7280; --ink-2:#3f5663;
  --accent:#0f6e7a; --accent-ink:#ffffff; --link:#e9a23b; --link-soft:#fbe6c2;
  --good:#2e8b57; --good-soft:#d8f0e2; --bad:#c2453a; --bad-soft:#f8dcd8; --line:#c9d6de;
  --shadow:0 2px 0 rgba(23,50,63,.12);
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-word:"Lexend","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1c22; --surface:#172a33; --surface-2:#203741; --ink:#e4eef2; --muted:#9db3bd; --ink-2:#c3d4db;
  --accent:#4fb8c4; --accent-ink:#06262b; --link:#f0b456; --link-soft:#3d3220;
  --good:#5cc489; --good-soft:#173a29; --bad:#ef7a6f; --bad-soft:#40211e; --line:#2c4651;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c22; --surface:#172a33; --surface-2:#203741; --ink:#e4eef2; --muted:#9db3bd; --ink-2:#c3d4db;
  --accent:#4fb8c4; --accent-ink:#06262b; --link:#f0b456; --link-soft:#3d3220;
  --good:#5cc489; --good-soft:#173a29; --bad:#ef7a6f; --bad-soft:#40211e; --line:#2c4651;
  --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.trackbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.lv h3 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.track .num{font-size:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.word{font-family:var(--f-word)}

/* ===== Home ===== */
.hero{display:flex;flex-direction:column;gap:6px;margin-block:8px 22px}
.hero h1{font-size:clamp(30px,6vw,44px);line-height:1.15}
.hero p{margin:0;color:var(--muted)}
.demo-chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.lv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.lv:not(:disabled):hover{transform:translateY(-2px);border-color:var(--accent)}
.lv:disabled{cursor:not-allowed;opacity:.62}
.lv .num{grid-row:span 3;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;background:var(--surface-2);color:var(--accent)}
.lv.cleared .num{background:var(--accent);color:var(--accent-ink)}
.lv h3{font-size:21px}
.lv .desc{color:var(--muted);font-size:14px}
.lv .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-weight:500;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.lock{background:var(--surface-2);color:var(--muted)}
.rules{margin-top:22px;background:var(--surface);border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.rules h2{font-size:20px;margin-bottom:6px}
.rules ul{margin:0;padding-left:20px;display:grid;gap:4px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
.ver{font-size:12px;opacity:.8}
.linkbtn{background:none;border:none;padding:4px 2px;text-decoration:underline;color:var(--muted)}

/* ===== Tiles (기차 칸) ===== */
.tile{display:inline-flex;align-items:baseline;font-family:var(--f-word);font-weight:600;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-size:17px;letter-spacing:.02em}
.tile .first,.tile .last{color:var(--ink);background:var(--link-soft);border-radius:4px;padding:0 2px}
.tile .last{background:var(--link);color:#2a1a00}
.tile.me{border-color:var(--accent)}
.joint{width:14px;height:4px;background:var(--link);border-radius:2px;flex:none}

/* ===== Game ===== */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:500}
.topbar h2{font-size:22px;flex:1;min-width:0}
.status{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.status .label{font-size:13px;color:var(--muted);margin-bottom:4px}
.status .btn.hint{white-space:nowrap;min-height:44px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:20px;height:20px;border-radius:6px;background:var(--surface-2);border:2px solid var(--line);transition:background .2s}
.dot.on{background:var(--good);border-color:var(--good)}
.hearts{letter-spacing:1px;white-space:nowrap}
.timer{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:-6px;margin-bottom:14px}
.timer > i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.timer.warn > i{background:var(--bad)}
.timectl{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:-6px 0 12px}
.rules .timectl{justify-content:flex-start;margin:6px 0 0}
.rules .note{margin:0;color:var(--muted);font-size:14px}
.tbtn{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:600;font-size:14px}
.tbtn:hover:not(:disabled){border-color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.tval{min-width:3.2em;text-align:center;color:var(--ink);font-family:var(--f-word)}

.chainbox{overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px}
.chain{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 4px}
.chain > *{flex:none}
.chain .tile.flash{outline:3px solid var(--bad);outline-offset:1px}
.chain .tile{font-size:15px}

.cpu{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.cpu .who{font-size:13px;color:var(--muted)}
.cpu .emoji{font-size:54px;line-height:1.1;margin-top:4px}
.cpu .big{font-family:var(--f-word);font-weight:700;font-size:clamp(36px,9vw,54px);letter-spacing:.03em;line-height:1.15;margin-top:2px;word-break:break-word}
.cpu .big .last{color:#2a1a00;background:var(--link);border-radius:8px;padding:0 6px;margin-left:2px}
.cpu .ko{color:var(--muted);font-size:17px}
.speak{margin-top:6px;background:var(--surface-2);border:none;border-radius:999px;padding:4px 12px;font-size:14px}
.ask{text-align:center;margin:16px 0 10px;font-size:18px}
.ask b{font-family:var(--f-word);font-size:26px;color:#2a1a00;background:var(--link);border-radius:8px;padding:0 10px;margin-right:4px}

/* 객관식: 한 줄에 보기 하나 — 단어(첫 글자 강조) 왼쪽, 뜻 오른쪽 */
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 16px;min-height:58px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;text-align:left;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.choice .w{font-family:var(--f-word);font-weight:600;font-size:26px;line-height:1.15}
/* 첫 글자 밑줄: g·j·p·q·y처럼 아래로 내려오는 글자에서도 끊기지 않게, 꼬리보다 아래에 끊김 없이 그림 */
.spell .choice .w .f{background:var(--link-soft);border-radius:4px;padding:0 3px}
.choice .w .f{font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.45em;text-decoration-skip-ink:none}
.choice .k{font-size:17px;color:var(--ink-2);text-align:right}
.choice.gone{visibility:hidden}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}

.typing{display:flex;gap:8px}
/* 영문 고정 입력칸의 커서(readOnly 칸은 커서가 안 보여서 대신 그림) */
.fcaret{position:absolute;width:2px;background:var(--ink);border-radius:1px;pointer-events:none;animation:fblink 1s steps(1) infinite}@keyframes fblink{50%{opacity:0}}
.myword{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:12px;border:2px solid var(--good);background:var(--good-soft)}
.myword small{font-size:13px;color:var(--muted);white-space:nowrap}.myword .word{font-size:24px;font-weight:700;color:var(--ink)}
.typing input{flex:1;min-width:0;font-family:var(--f-word);font-size:24px;font-weight:600;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{border:none;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:16px;box-shadow:var(--shadow)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.hint{background:var(--link-soft);color:var(--ink);border:2px solid var(--link)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.msg{min-height:28px;text-align:center;margin-top:10px;font-weight:500}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)} .msg.info{color:var(--muted)}
.hintbox{margin-top:10px;background:var(--link-soft);border:2px dashed var(--link);border-radius:12px;padding:8px 12px;text-align:center}
.review .rko{font-size:22px;color:var(--ink);font-weight:500;margin-top:4px}
.review .pat,.pat{font-family:var(--f-word);font-weight:700;font-size:26px;letter-spacing:.18em}
.ask b.plain{background:none;color:inherit;font-family:inherit;font-size:inherit;padding:0}
.note{color:var(--muted);font-size:14px}
.stamps{color:var(--link);letter-spacing:2px;font-size:15px;white-space:nowrap}
.nblist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.nbrow{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:2px 12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.nbrow .word{font-size:18px}.nbrow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.nblearned{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.review-end{margin:40px auto}
.target{background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:10px 14px;margin-bottom:10px;text-align:center}
.target .who{font-size:13px;color:var(--muted)}
.trow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.temoji{font-size:40px;line-height:1.1}.tko{font-size:20px;font-weight:700;color:var(--ink)}
.target .speak{margin-top:0}
.diff{font-weight:600;color:var(--accent);white-space:nowrap}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;margin:4px 0 10px;--n:5}
.slot{width:min(46px,calc((100% - (var(--n) - 1) * 6px) / var(--n)));flex:none;padding:0;text-align:center;color:var(--ink);height:50px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-word);font-weight:700;font-size:26px}
.slot.fixed{background:var(--surface-2);border-color:var(--surface-2)}.slot.given{background:var(--link-soft);border-color:var(--link)}
.slot.bin.first{background:var(--link-soft);border-width:3px}.slot.bin.first.ok{border-style:solid;border-color:var(--link)}
.slot.bin{border-style:dashed;border-color:var(--link);background:var(--surface)}.slot.bin:focus{border-style:solid;border-color:var(--accent);outline:3px solid var(--link);outline-offset:1px}.slot.on{border-color:var(--accent)}.slot.blank{border-style:dashed;border-color:var(--link)}
.blocks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:14px;padding:8px 10px 10px}
.tray-label{flex-basis:100%;text-align:center;font-size:12px;color:var(--muted)}.tray-label .linkbtn{font-size:13px;margin-left:8px;padding:4px 6px}.tray-label .linkbtn:disabled{opacity:.45;cursor:default;text-decoration:none}
.blk{min-width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-word);font-weight:700;font-size:26px;box-shadow:var(--shadow)}
.blk:hover:not(:disabled){border-color:var(--accent)}.blk:disabled{opacity:.25}
.note.center{text-align:center;margin:0 0 6px}
.listenbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.tgl{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;min-height:40px}
.tgl[aria-pressed="true"]{border-color:var(--accent);background:var(--good-soft)}
.tgl:disabled{opacity:.5;cursor:not-allowed}
.cpu.listen .ear{font-size:44px;line-height:1.1}
.lboxes{display:flex;justify-content:center;gap:5px;margin:6px 0 2px}
.lbox{width:22px;height:26px;border:2px solid var(--line);border-radius:6px;background:var(--surface-2)}
.lbox:last-child{border-color:var(--link);background:var(--link-soft)}
.speak:disabled{opacity:.45;cursor:not-allowed}
.score{font-weight:700;color:var(--ink)}
.combo{font-weight:700;color:var(--bad)}
.card .sum{color:var(--ink)}
.updbar{position:fixed;left:50%;top:calc(var(--vvt,0px) + 8px);transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 16px);animation:notepop .35s ease}
.updbar button{min-height:36px;border-radius:999px;border:0;padding:4px 14px;font-weight:700;background:var(--link);color:#2a1a00}.updbar .x{background:none;color:inherit;padding:4px 8px}
.badge-note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:notepop .35s ease;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
@keyframes notepop{0%{transform:translateX(-50%) scale(.92)}60%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}
.burst{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:40px;color:var(--bad);z-index:15;pointer-events:none;animation:burst 1.3s ease forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);opacity:.45;filter:grayscale(1)}
.bdg.got{opacity:1;filter:none;border-color:var(--link)}
.bdg .bi{font-size:34px;line-height:1.2}.bdg small{color:var(--muted);font-size:12px}.bdg .bd{color:var(--accent)}
.nbguide{background:var(--link-soft);border:1px solid var(--link);border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:14px}
.starchip{font-weight:700;white-space:nowrap}
.btn.buy{background:var(--surface);color:var(--ink);border:2px solid var(--link);font-size:14px;padding:6px 12px;box-shadow:none}
.btn.buy.armed{background:var(--link);color:#2a1a00}
.btn.buy small{font-weight:500;color:var(--muted)}
.buywrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.qty{display:flex;align-items:center;gap:6px;font-size:13px}.qty .tbtn{padding:0 9px;min-height:28px}
.lboxes.inline{display:inline-flex;margin:0 4px;vertical-align:middle}.lboxes.inline .lbox{width:14px;height:18px}
.pen{gap:4px;margin:4px 0}.pen .lbox{flex:0 1 30px;min-width:0;height:36px;display:grid;place-items:center;font-family:var(--f-word);font-weight:700;font-size:20px;color:var(--ink);background:var(--surface-2);border-color:var(--line)}.pen .lbox.on{background:var(--surface);border-color:var(--accent)}.lhint .lbox.qbox{border:3px solid var(--bad);background:var(--surface);color:var(--bad)}.askcap{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}.askcap .lbox.qbox.mini{width:18px;height:20px;display:inline-grid;place-items:center;font-size:12px;border-width:2px}
.hintbox > div{margin-top:4px}.lhint{padding:6px 10px}.lhint > div:first-child{margin-top:0}.lhint .speak{margin:0;padding:2px 10px}.lhint .pat{font-size:22px}.lack{font-size:12px;color:var(--bad)}.hcount{font-size:12px;color:var(--muted);white-space:nowrap}
.buyrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:-6px 0 12px;padding:6px 10px;border:2px dashed var(--link);border-radius:12px;background:var(--surface)}
#buyTime{display:block;margin:-6px 0 10px auto}
.cpu .btn.buy{margin:6px auto 0;display:block}
.snote{margin:6px auto 2px;max-width:420px;padding:6px 12px;border-radius:10px;background:var(--good-soft);color:var(--ink);font-size:15px;font-weight:600}.snote.miss{background:var(--link-soft);border:2px solid var(--link)}.card p.snote{color:var(--ink);margin:10px auto}
.hintbox .pat{font-family:var(--f-word);font-weight:700;font-size:24px;letter-spacing:.18em}

/* ===== Overlay ===== */
.overlay{position:fixed;inset:0;background:rgba(10,25,32,.55);display:grid;place-items:center;padding:16px;z-index:10}
.card{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.card .big-e{font-size:56px;line-height:1.1}
.card h3{font-size:26px;margin:6px 0}
.card p{margin:6px 0;color:var(--muted)}
.card .ex{font-family:var(--f-word);font-weight:700;color:var(--ink)}
#app{position:relative}
.rsteps{display:flex;gap:6px;justify-content:center;list-style:none;padding:0;margin:0 0 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rsteps li{padding:3px 10px;border-radius:999px;background:var(--surface-2)}.rsteps li.on{background:var(--link);color:#2a1a00;font-weight:700}.rsteps li.done{color:var(--good)}
.rest{background:var(--surface);border-radius:18px;padding:18px 16px;text-align:center;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
.rest h3{margin:6px 0 8px}.rest .big-e{font-size:52px;line-height:1.1}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

}

// 철자 차이(바꾸기·넣기·빼기·이웃 글자 순서 바꾸기를 1로 셈)
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; for(let j=1;j<=b.length;j++) d[i][j]=i?0:j; }
  for(let i=1;i<=a.length;i++){ let rowMin=Infinity;
    for(let j=1;j<=b.length;j++){ const c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);

    if(rowMin>max) return max+1; }

}

// 이 기기의 localStorage(wordchain-stars-v1)에 숫자 하나만 저장. 모든 수준이 같은 별을 씀(공용 기기면 다른 학생이 모은 별도 쓰게 됨)
const STAR_KEY='wordchain-stars-v1';
let stars=0; try{ stars=Math.max(0,parseInt(localStorage.getItem(STAR_KEY),10)||0); }catch(e){}
function setStars(n){ stars=Math.max(0,n); try{ localStorage.setItem(STAR_KEY,String(stars)); }catch(e){} document.querySelectorAll('.stars-n').forEach(el=>el.textContent=stars); }
// 한 판이 끝날 때: 이번 판에서 얻은 점수 중 아직 바꾸지 않은 만큼을 별로(나머지는 이 단계 도전 안에서 이어짐)
function bankStars(){ if(!G) return 0; const P=SETTINGS.shop.pointsPerStar, n=Math.floor((G.score-(G.banked||0))/P); if(n>0){ G.banked=(G.banked||0)+n*P; setStars(stars+n); G.starsGot=(G.starsGot||0)+n; } return Math.max(0,n); }
// 별로 사기: 한 번 누르면 확인 문구, 3초 안에 한 번 더 누르면 사용(confirm 창 없이)
function armBuy(btn,price,label,fn){
  if(!btn) return; let armed=false,t; const orig=btn.innerHTML;
  btn.onclick=()=>{ if(G&&G.locked) return; if(stars<price) return;
    if(!armed){ armed=true; btn.classList.add('armed'); btn.innerHTML=`한 번 더 누르면 ⭐ ${price}개 사용`; t=setTimeout(()=>{ armed=false; btn.classList.remove('armed'); btn.innerHTML=orig; },3000); return; }
    clearTimeout(t); setStars(stars-price); fn(); };
}

  if(n>=0&&n<11172){ const t=n%28; return KO_KEY[CHO[Math.floor(n/588)]]+KO_KEY[JUNG[Math.floor(n%588/28)]]+(t?KO_KEY[JONG[t]]:''); }
  return KO_KEY[c]||c; }).join(''); }

  const pos=koToEn(v.slice(0,inp.selectionStart)).length; inp.value=koToEn(v); inp.setSelectionRange(pos,pos); return true; }
// 영어 단어 입력칸(게임·복습·빈칸 채우기 공통)
// inputmode=email: 휴대폰에서 영문 자판이 뜸. lang=en: 일부 PC 브라우저가 영문 입력기로 전환
const enFormHTML=(ph,label,btn)=>`<form class="typing" id="f" autocomplete="off"><input id="inp" type="text" lang="en" inputmode="email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" aria-label="${esc(label)}"><button class="btn" type="submit">${btn}</button></form>`;
// 한글 자판: 입력기가 글자를 조합하는 동안 값을 바꾸면 글자가 빠지므로(rose → roe) 조합이 끝난 뒤에만 영어로 바꿈.
// 조합 중에는 바뀔 영어를 안내만 하고, 낼 때 한 번 더 바꿈. onInput(값): 글자가 바뀔 때마다(빈칸 채우기 미리 보기용)
function enInput(inp,form,onSubmit,onInput){
  inp.focus({preventScroll:true}); let composing=false;
  const koNote=()=>{ const e=koToEn(inp.value); msg(isBlocked(e,DICT.has(e.toLowerCase()))?'한글 자판이에요. 한/영 키를 눌러 영어로 바꿔 주세요.':`한글 자판이에요 → "${e}"(으)로 낼게요. 한/영 키를 눌러 영어로 바꾸면 편해요.`,'info'); };
  inp.addEventListener('compositionstart',()=>{composing=true;});
  inp.addEventListener('compositionend',()=>{ composing=false; setTimeout(()=>{ if(!composing&&latinize(inp)) koNote(); onInput&&onInput(koToEn(inp.value)); },0); });
  inp.addEventListener('input',e=>{ if(KO_RE.test(inp.value)){ if(e.isComposing||composing) koNote(); else if(latinize(inp)) koNote(); } onInput&&onInput(koToEn(inp.value)); });
  form.onsubmit=e=>{e.preventDefault(); onSubmit(koToEn(inp.value));};
  engKeys(inp);
}
// 영문 고정: 실제 키보드에서 한글 입력기가 켜져 있으면(누른 키가 입력기로 넘어가면) 입력칸을 영문 고정으로 바꾸고,
// 누른 키 자리(e.code)의 영어 글자를 바로 넣음 — 한글 자판이어도 영어로 써짐(웹 페이지는 운영체제의 한/영 상태를 바꿀 수 없음).
// 입력기는 고칠 수 있는 칸에서만 글자를 조합하므로 칸을 readOnly로 두고 글자는 스크립트가 씀(보이지 않는 커서는 .fcaret로 대신 그림).
// 한 번 알아채면 이 페이지의 다른 입력칸도 영문 고정. 휴대폰 화면 키보드(e.code 없음)는 그대로 두고 입력이 끝난 뒤 영어로 바꿈(latinize).
// 손가락으로 입력칸을 누르면(화면 키보드가 떠야 하므로) 영문 고정을 끔
let engMode=false;

function engKeys(el,single){
  let cr=null;
  const caret=()=>{
    if(!el.readOnly||document.activeElement!==el||!el.isConnected){ if(cr){ cr.remove(); cr=null; } return; }
    const p=el.parentNode; if(getComputedStyle(p).position==='static') p.style.position='relative';
    if(!cr){ cr=document.createElement('span'); cr.className='fcaret'; cr.setAttribute('aria-hidden','true'); p.appendChild(cr); }
    const cs=getComputedStyle(el), c=engKeys.ctx||(engKeys.ctx=document.createElement('canvas').getContext('2d'));
    c.font=cs.font; if('letterSpacing' in c) c.letterSpacing=cs.letterSpacing;
    const v=el.value, pos=el.selectionStart??v.length, fs=parseFloat(cs.fontSize), h=fs*1.25;
    const x=cs.textAlign==='center'?el.offsetLeft+el.offsetWidth/2+c.measureText(v).width/2+1
      :el.offsetLeft+parseFloat(cs.borderLeftWidth)+parseFloat(cs.paddingLeft)+c.measureText(v.slice(0,pos)).width-el.scrollLeft;
    cr.style.cssText=`left:${Math.round(x)}px;top:${Math.round(el.offsetTop+(el.offsetHeight-h)/2)}px;height:${Math.round(h)}px`;
  };
  const changed=()=>{ el.dispatchEvent(new Event('input',{bubbles:true})); caret(); };
  const put=s=>{
    if(single){ el.value=s; changed(); return; }
    const a=el.selectionStart??el.value.length, b=el.selectionEnd??a;
    el.value=el.value.slice(0,a)+s+el.value.slice(b); el.setSelectionRange(a+s.length,a+s.length); changed();
  };
  const on=()=>{ el.readOnly=true; el.setAttribute('aria-readonly','false'); el.classList.add('engmode'); caret(); };
  if(engMode) on();
  el.addEventListener('keydown',e=>{
    if(!el.readOnly){
      if(!imeKey(e)) return;
      // 한글 입력기를 처음 알아챈 순간: 지금까지 쓴 값을 기억했다가 영문 고정으로 바꾸고 이번 글자를 넣음(입력기가 만든 글자는 덮어씀)
      e.preventDefault(); const v0=koToEn(el.value), s0=Math.min(el.selectionStart??v0.length,v0.length), ch=e.code.slice(3).toLowerCase();
      engMode=true; on();
      setTimeout(()=>{ el.value=v0; if(!single) el.setSelectionRange(s0,s0); put(ch); },0);
      return;
    }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const m=/^Key([A-Z])$/.exec(e.code);
    if(m){ e.preventDefault(); put(m[1].toLowerCase()); return; }
    if(e.key==='Backspace'||e.key==='Delete'){
      if(single){ if(el.value){ e.preventDefault(); el.value=''; changed(); } return; }
      e.preventDefault(); let a=el.selectionStart??el.value.length, b=el.selectionEnd??a;
      if(a===b){ if(e.key==='Backspace'){ if(!a) return; a--; } else { if(b>=el.value.length) return; b++; } }
      el.value=el.value.slice(0,a)+el.value.slice(b); el.setSelectionRange(a,a); changed(); return;
    }
    if(e.key==='Enter'){ e.preventDefault(); const f=el.form; if(f){ if(f.requestSubmit) f.requestSubmit(); else f.querySelector('[type=submit]')?.click(); } return; }
    // 읽기 전용 칸은 ←·→·Home·End로 커서가 움직이지 않으므로 직접 옮김
    if(!single&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){ e.preventDefault(); const n=el.value.length, a=el.selectionStart??n;
      const to=e.key==='Home'?0:e.key==='End'?n:Math.max(0,Math.min(n,a+(e.key==='ArrowLeft'?-1:1))); el.setSelectionRange(to,to); caret(); return; }
  });
  el.addEventListener('paste',e=>{ if(!el.readOnly) return; e.preventDefault();
    const t=koToEn(e.clipboardData?.getData('text')||'').toLowerCase().replace(/[^a-z]/g,''); if(t) put(single?t.slice(-1):t); });
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'&&el.readOnly){ engMode=false; el.readOnly=false; el.removeAttribute('aria-readonly'); el.classList.remove('engmode'); caret(); } });
  ['focus','blur','click','select'].forEach(t=>el.addEventListener(t,()=>setTimeout(caret,0)));
}
let soundOn=true;
// 소리 버튼: 휴대폰에서는 글자를 숨기고 아이콘만
const sndHTML=()=>soundOn?'🔊<span class="t"> 소리 켬</span>':'🔈<span class="t"> 소리 끔</span>';
// 단어 읽기: 앞소리가 잘리지 않게 ① 읽던 소리를 끊은 뒤엔 잠깐 쉬고 ② 소리 없는 짧은 여유(잠든 스피커 깨우기) 뒤에 ③ 조금 천천히 읽음.
// 다 읽으면 끝나는 Promise를 돌려줌(소리 꺼짐·오류면 바로, 끝 신호가 안 오는 브라우저는 시간이 지나면 끝남)
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// 읽기 속도와 흐름의 여유 시간(쫓기는 느낌이 없도록)
const SPEECH_RATE=.7;        // 단어 읽는 속도(1이 보통)
const SAY_DELAY=500;         // 컴퓨터 단어가 화면에 나온 뒤 읽기 시작까지(ms)
// 블루투스 이어폰은 소리가 끊기면 연결을 쉬게 해 첫소리가 잘림 →
// 게임 화면에 있는 동안 들리지 않을 만큼 작은 소리를 계속 흘려 연결이 쉬지 않게 함(사용자가 버튼을 누를 때 시작)
let actx=null;
function audioKeepAlive(on){
  try{
    if(!on){ if(actx&&actx.state==='running') actx.suspend(); return; }
    if(!actx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      actx=new AC(); const buf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*1e-5; // 약 -100dB: 들리지 않음
      const src=actx.createBufferSource(); src.buffer=buf; src.loop=true; src.connect(actx.destination); src.start();
    }
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function speak(w,queue,rate){
  return new Promise(res=>{

      const ss=speechSynthesis, pad=new SpeechSynthesisUtterance('.'), u=new SpeechSynthesisUtterance(w);
      pad.lang=u.lang='en-US'; pad.volume=0; u.rate=rate||(track==='basic'?SETTINGS.basicSpeech.rate:SPEECH_RATE);

      u.onend=fin; u.onerror=fin; setTimeout(fin,1500+w.length*250);
      const go=()=>{ ss.speak(pad); ss.speak(u); };

    }catch(e){ res(); }

const SILENT_OK='잘 들었어요! ';

const GH_F=['laugh','enough','cough','tough','rough','trough'];
const SILENT_NOTES=[
  {id:'mb', when:w=>w.endsWith('mb'), text:'{w}의 b는 소리가 나지 않아요.'},
  {id:'mn', when:w=>w.endsWith('mn'), text:'{w}의 n은 소리가 나지 않아요.'},
  {id:'gn', when:w=>w.endsWith('gn'), text:'{w}의 g는 소리가 나지 않아요.'},
  {id:'ck', when:w=>w.endsWith('ck'), text:'{w}은 k 소리지만 ck로 끝나요.'},
  {id:'ic', when:w=>w.endsWith('ic'), text:'{w}은 k 소리지만 c로 끝나요.'},
  {id:'ph', when:w=>w.endsWith('ph'), text:'{w}는 f 소리지만 ph로 끝나요.'},
  {id:'th', when:w=>w.endsWith('th'), text:'{w}는 {f}{fp} 아니라 th로 끝나요.'},
  {id:'gh-f', when:w=>GH_F.includes(w), text:'{w}는 f 소리지만 gh로 끝나요.'},
  {id:'gh', when:w=>w.endsWith('gh'), text:'{w}의 gh는 소리가 나지 않아요.'},   // 묵음 -gh(high, weigh, through, though …)
  {id:'ed', when:w=>isPastEd(w), text:'{w}처럼 과거형 -ed는 끝소리가 약하게 들려요.'},
  {id:'le', when:w=>w.endsWith('le')&&isCons(w[w.length-3]), text:'{w}는 e로 끝나요. -le는 [을]처럼 소리 나지만 끝 글자는 e예요.'},
  {id:'stop-e', when:w=>/[tdkpb]e$/.test(w), text:'{w}의 끝 e는 소리가 나지 않아요.'},   // 자음+묵음 e 중 -te·-de·-ke·-pe·-be
  {id:'e', when:w=>w.endsWith('e')&&isCons(w[w.length-2]), text:'{w}는 e로 끝나요. 끝의 e는 소리가 나지 않아요.'},
  {id:'y', when:w=>w.endsWith('y')&&isCons(w[w.length-2]), text:'{w}는 y로 끝나요. 끝의 -y는 [이]로 소리 나요.'},

const isCons=x=>!!x&&!'aeiou'.includes(x);
// 과거형 -ed인지: 원형이 단어 목록에 있으면(played→play, liked→like, stopped→stop, cried→cry). see→seed처럼 모음+e 원형은 제외
function isPastEd(w){
  if(!w.endsWith('ed')||w.length<4) return false;
  const has=x=>x.length>=2&&(DICT.has(x)||WORDS.has(x)), s=w.slice(0,-2);
  return has(s)||(has(w.slice(0,-1))&&isCons(w[w.length-3]))||(s.length>2&&s[s.length-1]===s[s.length-2]&&has(s.slice(0,-1)))||(w.endsWith('ied')&&has(w.slice(0,-3)+'y'));

// f: 학생 답의 첫 글자. 컴퓨터 단어의 끝 글자와 같으면(맞힘) 칭찬을 붙임
function silentNote(cw,f){
  const n=SILENT_NOTES.find(x=>x.when(cw)); if(!n) return '';
  const ok=f===cw[cw.length-1], g=ok?'s':f;
  return (ok?SILENT_OK:'')+n.text.replace(/\{w\}/g,cw).replace(/\{f\}/g,g).replace(/\{fp\}/g,'lmnr'.includes(g)?'이':'가');
}

// ---------- 게임 상태 ----------
let G=null, timerId=null;
function start(id){

  // 컴퓨터는 첫 글자와 끝 글자가 같은 단어(dad, trust 등)와 수 단어는 내지 않음
  G={L,pool,cpuPool:byTier(L.cpu).filter(x=>!x.cmp&&!NUMW.has(x.w)&&x.w[0]!==last(x.w)&&x.w.length>=(L.cpuMin||L.min)&&x.w.length<=(L.cpuMax||99)),streak:0,hints:HINTS,used:new Set(),chain:[],lines:[],asked:[],cur:null,hintStep:0,removed:new Set(),locked:false,timeLeft:0,diff:0,okRun:0,badRun:0,diffMove:'',clean:true,cleanRun:0,firstTime:!save.cleared[id],usedStored:0,buyQty:1,lives:SETTINGS.lives,t0:Date.now(),turns:0,rights:0,combo:0,bestCombo:0,score:0,newBadges:[],hintUsed:false,turnHint:false,failedBefore:false,listenRun:0};

function startsWith(ch,pool){return pool.filter(x=>x.w[0]===ch&&!G.used.has(x.w));}
// 컴퓨터가 낼 단어: 학생이 이어 갈 수 있는 끝 글자로 끝나는 단어
function pickCpu(firstCh){
  let cands=G.cpuPool.filter(x=>!G.used.has(x.w)&&(!firstCh||x.w[0]===firstCh)&&startsWith(last(x.w),G.pool).length>=(G.L.mode==='type'?3:1));
  if(!cands.length) return null;
  // 학생이 시작할 글자가 겹치지 않게: 최근 두 번 요구한 글자로 끝나는 단어는 피함 (없으면 허용)
  const recent=G.asked.slice(-2), fresh=cands.filter(x=>!recent.includes(last(x.w)));
  if(fresh.length) cands=fresh;

  // 이어 갈 단어가 적은 끝 글자(특히 y)는 덜 나오게
  const groups=new Map(); cands.forEach(x=>{const ch=last(x.w); if(!groups.has(ch)) groups.set(ch,[]); groups.get(ch).push(x);});
  const letters=[...groups.keys()];
  const lw=ch=>{let k=Math.min(startsWith(ch,G.pool).length,15)/15; if(ch==='y')k*=.25; return k;};
  const ws=letters.map(lw), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<letters.length;i++){ r-=ws[i]; if(r<=0) return pickCore(groups.get(letters[i])); }

}
// 하트 방식인지(보통·도전 수준, SETTINGS.lives>0)
const livesOn=(t=track)=>t!=='basic'&&SETTINGS.lives>0;

// 오답 한 번: 하트 방식이면 하트 1개(다 잃으면 성공 수 0), 아니면 연속 기록 0. 오답 화면에 붙일 문구와 버튼을 돌려줌
function loseTurn(){
  const had=G.streak, lv=livesOn(); if(lv){ G.lives--; G.livesLost=(G.livesLost||0)+1; } const out=!lv||G.lives<=0; if(out) G.streak=0;
  G.combo=0; G.listenRun=0;

  return {lv,text:text+(gotStars?`<p class="sum">이번 판에서 ⭐ +${gotStars}</p>`:''),label:out?'다시 시작':'계속',next:()=>{ if(out) G.lives=SETTINGS.lives; newChain(); }};
}
function newChain(){ G.blockedN=0; G.boughtTime=false; G.boughtReplay=false; G.used.clear(); archiveChain(); const c=pickCpu(null); setCpu(c); }
// 끝말잇기 줄이 끝날 때(틀림·컴퓨터가 짐) 이어 간 단어만 G.lines에 모아 둠(통과 뒤 하이라이트용). 대답하지 못한 마지막 컴퓨터 단어는 뺌
function archiveChain(){ const seg=G.chain.slice(); if(seg.length&&!seg[seg.length-1].me) seg.pop(); if(seg.some(x=>x.me)) G.lines.push(seg); G.chain=[]; }
function setCpu(c){
  G.listen=listenOn(G.L); G.revealed=false; G.replays=G.L.listen==='force'?SETTINGS.listen.hardReplays:SETTINGS.listen.normalReplays;
  G.cur=c; G.used.add(c.w); G.chain.push({w:c.w,d:disp(c),me:false}); G.asked.push(last(c.w)); G.hintStep=0; G.removed=new Set(); G.locked=false; G.wrongTries=0; G.silent=''; G.okNote=''; G.turnHint=false; G.myWord='';
  G.options = G.L.mode==='choice' ? makeOptions() : null;

  // 이번 단어의 제한 시간(lim), 지난 시간(elapsed), 힌트로 받은 시간(bonus)
  if(G.L.time){ G.lim=timeOf(G.L); G.elapsed=0; G.bonus=0; G.timeLeft=G.lim; }
  // 컴퓨터 단어를 읽고, 기초 1~3단계면 잠깐 쉰 뒤 학생이 완성할 다음 단어를 읽음
  render(); setTimeout(()=>{ if(!(G&&G.cur===c)) return; const said=speak(c.w,true);
    if(G.target&&GUIDED(G.L.mode)){ const t=G.target; said.then(()=>wait(soundOn?SETTINGS.basicSpeech.targetGap:0)).then(()=>{ if(G&&G.cur===c&&!G.locked) speak(t.w,true); }); } },SAY_DELAY);
  if(G.L.time) startTimer();
}
function makeOptions(){
  const ch=last(G.cur.w);
  const good=startsWith(ch,G.pool).filter(x=>startsWith(last(x.w),G.cpuPool).length>0);
  const right=pickCore(good.length?good:startsWith(ch,G.pool));
  const wrongAll=G.pool.filter(x=>x.w[0]!==ch&&x.w!==G.cur.w);
  const wrong=[];
  if(G.L.n>=4){ const trap=wrongAll.filter(x=>last(x.w)===ch); if(trap.length) wrong.push(rnd(trap)); }
  shuffle(wrongAll).forEach(x=>{ if(wrong.length<G.L.n-1&&!wrong.includes(x)&&x.w[0]!==wrong[0]?.w[0]) wrong.push(x); });
  return shuffle([right,...wrong]);
}

// ---------- 기초 1~3단계: 다음 단어의 철자 완성 ----------
const GUIDED=m=>m==='spell'||m==='blocks'||m==='blanks';
// 다음에 올 단어: 컴퓨터 단어의 끝 글자로 시작, 글자 수 tMin~tMax, 컴퓨터가 이어 갈 수 있는 단어(기본 어휘 우선)
function chooseTarget(ch){
  const L=G.L, base=startsWith(ch,G.pool).filter(x=>/^[a-z]+$/.test(x.w)&&!NUMW.has(x.w));
  const fit=base.filter(x=>x.w.length>=L.tMin&&x.w.length<=L.tMax), goOn=fit.filter(x=>startsWith(last(x.w),G.cpuPool).length>0);
  return pickCore(goOn.length?goOn:fit.length?fit:base);
}
// 학생들이 자주 하는 철자 실수로 틀린 보기 만들기(첫 글자는 그대로): 모음 바꾸기, 끝 e 빼기·붙이기, 겹자음 빼기·넣기, 이웃 글자 순서 바꾸기
function misspellings(w,k){
  const V='aeiou', byRule=[[],[],[],[]], isV=c=>V.includes(c);
  for(let i=1;i<w.length;i++) if(isV(w[i])) for(const v of V) if(v!==w[i]) byRule[0].push(w.slice(0,i)+v+w.slice(i+1));
  byRule[1].push(w.endsWith('e')?w.slice(0,-1):w+'e');
  for(let i=1;i<w.length;i++){ if(w[i]===w[i-1]) byRule[2].push(w.slice(0,i)+w.slice(i+1)); else if(!isV(w[i])&&i<w.length-1) byRule[2].push(w.slice(0,i)+w[i]+w.slice(i)); }
  for(let i=1;i<w.length-1;i++) if(w[i]!==w[i+1]) byRule[3].push(w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2));
  const okW=x=>x!==w&&x.length>=2&&!DICT.has(x)&&!isEnglish(x), out=[], lists=byRule.map(l=>shuffle(l.filter(okW)));
  for(let r=0;out.length<k&&lists.some(l=>l.length);r=(r+1)%4){ const l=lists[r]; while(l.length){ const x=l.pop(); if(!out.includes(x)){ out.push(x); break; } } }
  for(let n=0;out.length<k&&n<200;n++){ const i=1+Math.floor(Math.random()*(w.length-1)), x=w.slice(0,i)+'bcdfghklmnprstvw'[Math.floor(Math.random()*16)]+w.slice(i+1); if(okW(x)&&!out.includes(x)) out.push(x); }
  return out;
}
// 자동 조절 단계(diff)별 난이도: 1단계 보기 수, 2단계 헷갈리는 글자 블록 수, 3단계 빈칸 수(첫 글자 + 1~3칸, 단어 길이의 절반까지)
const DIFF_MAX={spell:1,blocks:3,blanks:2};
const CONFUSE={b:'dp',d:'bp',p:'bq',q:'p',m:'n',n:'mu',u:'nv',v:'uw',w:'v',i:'el',e:'ia',a:'eo',o:'au',c:'k',k:'c',s:'c',g:'j',j:'g',l:'i',r:'l',t:'f',f:'t',h:'n',y:'i',x:'z',z:'s'};
function prepGuided(){
  const t=G.target, w=t.w, m=G.L.mode; G.reveal=0; G.placed=[]; G.blankVals={};
  if(m==='spell') G.options=shuffle([w,...misspellings(w,2+G.diff)]);
  if(m==='blocks'){ const extra=[]; for(let i=0;i<G.diff;i++){ const src=w[1+Math.floor(Math.random()*(w.length-1))]; const c=(CONFUSE[src]||'aeiou')[Math.floor(Math.random()*(CONFUSE[src]||'aeiou').length)]; extra.push(c); }
    G.blocks=shuffle([...w.slice(1),...extra].map((c,i)=>({c,i,used:false}))); }
  // 빈칸은 2칸 이상이고 첫 글자(컴퓨터 단어의 끝 글자)는 항상 빈칸
  if(m==='blanks'){ const n=Math.min(2+G.diff,Math.max(2,Math.floor(w.length/2))); G.blankIdx=[0,...shuffle([...Array(w.length).keys()].slice(1)).slice(0,n-1)].sort((a,b)=>a-b); }
}
// 연속 정답·오답에 따라 한 칸 어렵게/쉽게(같은 단계 안에서 유지)
function adapt(ok){
  if(!GUIDED(G.L.mode)) return; const A=SETTINGS.adapt, max=DIFF_MAX[G.L.mode];
  if(ok){ G.okRun++; G.badRun=0; if(G.okRun>=A.upAfter){ G.okRun=0; if(G.diff<max){ G.diff++; G.diffMove='up'; } } }
  else { G.badRun++; G.okRun=0; if(G.badRun>=A.downAfter){ G.badRun=0; if(G.diff>0){ G.diff--; G.diffMove='down'; } } }
}
const FIRST_MSG='컴퓨터 단어의 끝 글자를 다시 봐요.';
// 학생이 완성한 철자 판정
function guidedAnswer(word){
  if(G.locked) return; const t=G.target;
  if(word===t.w){ success(t); return; }
  nbAdd(t.w,'wrong');
  fail((word&&word[0]!==t.w[0]?`첫 글자가 달라요. ${FIRST_MSG} `:'')+`<b>${esc(word||'(빈칸)')}</b>는 철자가 달라요. 정답은 <b>${esc(disp(t))}</b> (${esc(plainKo(t.ko))})예요.`,null);
}
// 키보드 조작: 객관식·철자 고르기는 숫자 키, 글자 블록은 글자 키·Backspace (입력칸에 쓰는 중이거나 창이 떠 있으면 무시)

const slotHTML=(c,cls)=>`<span class="slot${cls?' '+cls:''}">${c?esc(c):''}</span>`;

    const ins=[...ans.querySelectorAll('.bin')];
    const fix=(el,e)=>{ if(e&&e.isComposing) return; const raw=el.value; const v=koToEn(raw).toLowerCase().replace(/[^a-z]/g,''); el.value=v.slice(-1); G.blankVals[el.dataset.i]=el.value;
      if(KO_RE.test(raw)) msg('한글 자판이에요. 한/영 키를 눌러 영어로 바꿔 주세요.','info');
      // 첫 글자 칸: 맞으면 연결선이 이어지고, 틀리면 끝 글자를 다시 보게 함(다음 칸으로 넘어가지 않음)
      if(el.dataset.i==='0'){ const good=el.value===w[0]; el.classList.toggle('ok',good&&!!el.value);
        if(el.value&&!good){ msg(FIRST_MSG,'info'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400); el.select(); return; }
        if(good){ linkLand(); msg('','info'); } }
      if(el.value){ const nx=ins[ins.indexOf(el)+1]; if(nx) nx.focus({preventScroll:true}); } };
    ins.forEach(el=>{ el.addEventListener('input',e=>fix(el,e)); el.addEventListener('compositionend',()=>setTimeout(()=>fix(el),0));
      el.addEventListener('focus',()=>el.select());
      el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value){ const pv=ins[ins.indexOf(el)-1]; if(pv){ e.preventDefault(); pv.focus({preventScroll:true}); pv.value=''; G.blankVals[pv.dataset.i]=''; } } }); });
    ins.forEach(el=>engKeys(el,true));
    (ins.find(el=>!el.value)||ins[0])?.focus({preventScroll:true});
    ans.querySelector('#f').onsubmit=e=>{ e.preventDefault(); if(G.locked) return;
      if(ins.some(el=>!el.value)){ msg('빈칸을 모두 채워 주세요.','info'); (ins.find(el=>!el.value)).focus({preventScroll:true}); return; }
      const word=w.split('').map((c,i)=>G.blankIdx.includes(i)?ans.querySelector(`.bin[data-i="${i}"]`).value:c).join('');
      if(!DICT.has(word)&&isBlocked(word)){ ins.forEach(el=>{ el.value=''; G.blankVals[el.dataset.i]=''; }); blockedInput(ins[0]); return; }
      G.blankVals={}; guidedAnswer(word); };
  }
}

// 컴퓨터 단어의 끝 글자 → 다음 단어의 첫 글자(기초 1~3단계): 모든 화면에서 선 대신 handoff(끝 글자가 첫 글자 자리로 건너감)·land(닿은 칸 반짝임)
// 빈칸 채우기는 첫 글자를 맞게 채우면 컴퓨터 끝 글자와 첫 칸이 함께 반짝임(동작 줄이기 설정이면 생략)
const calm=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// 첫 글자 자리: 철자 고르기는 보기마다의 첫 글자, 글자 블록·빈칸 채우기는 첫 칸
const linkEnds=()=>G.L.mode==='spell'?[...$app.querySelectorAll('#answer .choice .f')]:[$app.querySelector('#answer .slots .slot')].filter(Boolean);
const flash=el=>{ clearTimeout(el._land); el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); el._land=setTimeout(()=>el.classList.remove('land'),650); };
// 새 컴퓨터 단어마다 끝 글자가 첫 글자 자리로 한 번 건너감. 빈칸 채우기는 답을 대신 채우지 않도록 글자 없이 동그라미만
function handoff(){
  if(calm()||!G||!GUIDED(G.L.mode)) return;
  const a=$app.querySelector('.cpu .big .last'); if(!a) return;
  const ra=a.getBoundingClientRect(), blank=G.L.mode==='blanks';
  linkEnds().forEach((b,i)=>{ const rb=b.getBoundingClientRect(), el=document.createElement('span');
    el.className='hand'+(blank?' dot':''); el.setAttribute('aria-hidden','true'); if(!blank) el.textContent=a.textContent;
    const sz=blank?Math.min(ra.width,ra.height,34):0;
    el.style.cssText=blank?`left:${ra.left+ra.width/2-sz/2}px;top:${ra.top+ra.height/2-sz/2}px;width:${sz}px;height:${sz}px`
      :`left:${ra.left}px;top:${ra.top}px;width:${ra.width}px;height:${ra.height}px;font-size:${getComputedStyle(a).fontSize}`;
    document.body.appendChild(el);
    const dx=rb.left+rb.width/2-(ra.left+ra.width/2), dy=rb.top+rb.height/2-(ra.top+ra.height/2), s=blank?1:Math.max(.4,Math.min(1,rb.height/ra.height));
    const end=()=>{ el.remove(); if(b.isConnected) flash(b); };
    if(!el.animate){ end(); return; }
    el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.45}px,${dy*.5-24}px) scale(1.05)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],
      {duration:750,delay:i*90,easing:'ease-in-out',fill:'forwards'}).finished.then(end,end);
  });
}
// 빈칸 채우기에서 첫 글자를 맞게 채우면: 컴퓨터 끝 글자와 첫 칸이 함께 반짝임
function linkLand(){ if(calm()) return; [$app.querySelector('.cpu .big .last'),...linkEnds()].forEach(e=>e&&flash(e)); }

// ---------- 휴대폰 화면 키보드 ----------
// 키보드가 올라오면(보이는 높이가 120px 넘게 줄면) html.kb로 화면을 줄이고, 브라우저가 입력칸을 보이려고 화면을 밀어 올린 것을 되돌림:
// 맨 위가 보이게 두되, 입력칸(과 확인 버튼)이 키보드에 가려지면 가려지지 않을 만큼만 올림. 아이폰·안드로이드 공통(visualViewport)
(()=>{ const vv=window.visualViewport; if(!vv) return;
  const root=document.documentElement; let full=0, wid=0, touchUntil=0, timer=0;
  const field=()=>{ const a=document.activeElement; return a&&a.tagName==='INPUT'&&/^(text|search|email)$/.test(a.type)&&$app.contains(a)?a:null; };
  const pin=()=>{ const a=field(); if(!a||!root.classList.contains('kb')||Date.now()<touchUntil) return;
    const y=e=>e.getBoundingClientRect().bottom+scrollY+8, form=a.closest('form')||a, cpu=$app.querySelector('.cpu');   // 문서 기준 아래끝
    // 확인 버튼까지 보이게 하되, 그러려면 컴퓨터 단어 카드가 가려지는 아주 작은 화면에서는 입력칸까지만(확인은 키보드의 Enter)
    // 이미 필요한 곳(컴퓨터 단어 카드 위쪽, 입력칸)이 다 보이면 건드리지 않음 — 칸을 옮길 때마다 브라우저의 스크롤과 다투면 화면이 떨림
    const seen=(cpu?cpu.getBoundingClientRect().top>=vv.offsetTop-1:true)&&form.getBoundingClientRect().bottom<=vv.offsetTop+vv.height;
    if(seen) return;
    let want=Math.max(0,y(form)-vv.height); const cap=cpu?cpu.getBoundingClientRect().top+scrollY-4:Infinity;
    if(want>cap) want=Math.max(cap,y(a.closest('.slots')||a)-vv.height);
    const now=scrollY+vv.offsetTop;
    if(Math.abs(want-now)>2) scrollTo(0,want-vv.offsetTop); };
  const update=()=>{
    if(innerWidth!==wid){ wid=innerWidth; full=0; }                                  // 회전하면 기준 높이를 다시 잼
    full=Math.max(full,vv.height);
    // 터치 화면에서만(컴퓨터 창 크기 바꾸기 제외), 두 손가락으로 확대한 때는 제외
    const on=!!field()&&full-vv.height>120&&Math.abs((vv.scale||1)-1)<.05&&!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
    if(on!==root.classList.contains('kb')){ root.classList.toggle('kb',on); if(!on&&scrollY>0&&$app.querySelector('.status')) scrollTo(0,0); }   // 키보드가 내려가면 게임 화면은 맨 위로
    root.style.setProperty('--vvt',vv.offsetTop+'px'); root.style.setProperty('--kbh',Math.round(full-vv.height)+'px');
    clearTimeout(timer); pin(); timer=setTimeout(pin,250); };                        // 키보드가 다 올라온 뒤 한 번 더
  vv.addEventListener('resize',update); vv.addEventListener('scroll',update);
  addEventListener('focusin',()=>setTimeout(update,50)); addEventListener('focusout',()=>setTimeout(update,80));
  // 학생이 직접 화면을 끌어 볼 때는 되돌리지 않음
  addEventListener('touchmove',()=>{ touchUntil=Infinity; },{passive:true});
  addEventListener('touchend',()=>{ if(touchUntil===Infinity) touchUntil=Date.now()+1200; },{passive:true});
  update();
})();

// 보관 힌트: wordchain-v2 수준별 진도 안(prog.<수준>.storedHints)에 개수만 저장 → '이 수준 기록 지우기'로 함께 지워짐
const storedHints=()=>save.storedHints||0;
function setStored(n){ save.storedHints=Math.max(0,Math.min(SETTINGS.shop.maxStored,n)); persist(); }
const storeRoom=()=>SETTINGS.shop.maxStored-storedHints();
const canUseStored=()=>storedHints()>0&&(G.usedStored||0)<SETTINGS.shop.maxUsePerRun;
const canHint=()=>G.hints>0||canUseStored();
function consumeHint(){ if(G.hints>0){ G.hints--; return; } setStored(storedHints()-1); G.usedStored=(G.usedStored||0)+1; }
function hintBtnHTML(){

const buyRowHTML=()=>G.buyOpen&&G.hints<=0&&storeRoom()>0&&stars>=hintPrice()?`<div class="buyrow" role="group" aria-label="보관 힌트 사기">${buyHTML()}<button class="linkbtn" id="buyClose">닫기</button></div>`:'';

// ---------- 콤보·점수·배지 ----------
function calcScore(o,combo,listen,hint,inNb){
  const S=SETTINGS.score, n=o.w.length; let bonus=0;
  if(n>=S.lenFrom) bonus+=(n-S.lenFrom+1)*S.lenPer;
  if(o.core===2) bonus+=S.core2; else if(o.core===1) bonus+=S.core1;   // 기본 어휘 보너스
  if(inNb) bonus+=S.notebookBonus;                         // 수첩 단어(외운 단어 제외)를 정답으로 쓰면
  if(hint) bonus=0;                                          // 힌트를 쓴 턴은 길이·기본 어휘 보너스만 없어짐
  const mult=(S.combo.find(([c])=>combo>=c)||[0,1])[1]*(listen?S.listen:1);
  return Math.floor((S.base+bonus+(o.outside?S.outside:0))*mult);
}
const scoreFor=(o,inNb)=>calcScore(o,G.combo,G.listen,G.turnHint,inNb);
function checkBadges(o){
  award('first');
  if(G.combo>=B.fire[0]) award('fire5'); if(G.combo>=B.fire[1]) award('fire10');
  if(o.w.length>=B.longWord) award('long');
  const st=stat();
  if(o.core&&!o.outside&&!st.tb.includes(o.w)){ st.tb.push(o.w); persist(); }
  if(st.tb.length>=B.core[0]) award('tb10'); if(st.tb.length>=B.core[1]) award('tb30');
  if(o.outside){ st.outside++; persist(); if(st.outside>=B.outside) award('outside'); }
  if(G.failedBefore&&G.combo>=B.comeback) award('comeback');
  if(G.listen){ G.listenRun++; if(G.listenRun>=B.ears) award('ears'); } else G.listenRun=0;
}

  if(hide) armBuy($app.querySelector('#buyReplay'),SETTINGS.shop.replayPrice,'',()=>{ G.boughtReplay=true; G.replays++; const b=$app.querySelector('#say'); b.disabled=false; b.textContent=`🔊 다시 듣기 (${G.replays})`; $app.querySelector('#buyReplay').remove(); });
  if(L.listenOpt) bindListenBar();
  // 시간 늘리기는 이번 단어에 바로 적용, 줄이기는 다음 단어부터
  if(L.time) bindTimeCtl($app,L,(t,d)=>{
    if(d>0&&!G.locked){ G.lim=Math.max(G.lim,t); G.timeLeft=G.lim+G.bonus-G.elapsed; msg(`제한 시간 ${t}초 — 이번 단어부터 적용돼요.`,'info'); }
    else msg(`제한 시간 ${t}초 — 다음 단어부터 적용돼요.`,'info');
    $app.querySelector('#inp')?.focus({preventScroll:true}); });
  const ans=$app.querySelector('#answer');
  if(keyHandler){ document.removeEventListener('keydown',keyHandler); keyHandler=null; }
  if(GUIDED(L.mode)){ $app.querySelector('#sayT').onclick=()=>{audioKeepAlive(true);const o=soundOn;soundOn=true;speak(G.target.w);soundOn=o;}; renderGuided();
    const gl=G, cl=c;
    if(G.handed!==c){ G.handed=c; setTimeout(()=>{ if(G===gl&&G.cur===cl&&!G.locked) handoff(); },450); } }
  else if(L.mode==='choice'){
    // 한 줄에 보기 하나: 단어(첫 글자 강조) · 뜻. 그림은 쓰지 않음
    ans.innerHTML=`<div class="choices n${G.options.length}">${G.options.map((o,i)=>`<button class="choice${G.removed.has(o.w)?' gone':''}" data-i="${i}" ${G.removed.has(o.w)?'tabindex="-1"':''}>
      <span class="w"><span class="f">${esc(disp(o)[0])}</span>${esc(disp(o).slice(1))}</span><span class="k">${esc(plainKo(o.ko))}</span></button>`).join('')}</div>`;
    ans.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickChoice(+b.dataset.i,b));
    numberKeys(ans);
  }else{
    // inputmode=email: 휴대폰에서 영문 자판이 뜸. lang=en: 일부 PC 브라우저가 영문 입력기로 전환
    if(G.myWord){ ans.innerHTML=`<div class="typing"><div class="myword" role="status"><small>✏️ 내가 쓴 단어</small><span class="word">${esc(G.myWord)}</span></div></div>`; }
    else ans.innerHTML=hide?enFormHTML("영어 단어","들은 단어의 끝 글자로 시작하는 영어 단어","내기"):enFormHTML(`${ch}...`,`${ch}로 시작하는 영어 단어`,"내기");
    if(!G.myWord) enInput(ans.querySelector('#inp'),ans.querySelector('#f'),submitTyped);
  }
  if(G.hintStep>0) showHint(false);
  if(L.listen==='force'&&!G.listen) msg(listenWhy()?`🎧 ${listenWhy()} — 이번에는 단어를 보여 줘요.`:'','info');
}
function msg(t,cls){const m=$app.querySelector('#msg'); if(m){m.textContent=t;m.className='msg '+(cls||'');}}

// ---------- 정답 처리 ----------
function pickChoice(i,btn){
  if(G.locked) return; const o=G.options[i];
  if(o.w[0]===last(G.cur.w)){ btn.classList.add('right'); success(o); }
  else { btn.classList.add('wrong'); speak(o.w); const r=G.options.find(x=>x.w[0]===last(G.cur.w)); fail(`<b>${esc(disp(o))}</b>는 <b>${esc(o.w[0])}</b>로 시작해요.`, r); }
}
function submitTyped(raw){
  if(G.locked) return;
  const w=raw.trim().toLowerCase(); const ch=last(G.cur.w); const inp=$app.querySelector('#inp');
  if(!w){msg('단어를 입력하세요.','info');return;}
  if(!/^[a-z]+$/.test(w)){msg('영어 알파벳만 써 주세요.','info');return;}
  if(!DICT.has(w)&&isBlocked(w)){ blockedInput(inp); return; }
  if(DICT.has(w)&&(w[0]!==ch||G.used.has(w))) speak(w);
  if(w[0]!==ch){ G.silent=G.listen&&!G.revealed?silentNote(G.cur.w,w[0]):''; fail(`<b>${esc(w)}</b>는 <b>${esc(w[0])}</b>로 시작해요. <b>${esc(ch)}</b>로 시작해야 해요.`, example(ch)); return; }
  if(G.used.has(w)){ const k=G.chain.findIndex(x=>x.w===w); const who=k>=0?(G.chain[k].me?'내가':'컴퓨터가'):'';
    fail(`<b>${esc(w)}</b>는 이번 끝말잇기에서 ${k>=0?`${k+1}번째에 ${who} `:''}이미 쓴 단어예요. 위의 단어 줄에서 확인해 보세요.`, example(ch)); return; }
  if(w.length<G.L.min){ msg(`${G.L.min}글자 이상 단어를 써 주세요.`,'info'); inp.select(); return; }
  const d=DICT.get(w);
  if(d){ success(d); return; }
  // 단어장 밖이지만 올바른 영어 단어: 정답(뜻은 표시하지 않음)
  if(isEnglish(w)){ success({w,ko:'',outside:true}); return; }
  // 틀린 단어: 철자 도움을 보여 주고 다시 쓸 기회(SETTINGS.wrongRetry번), 그다음은 오답
  const sug=suggest(w); G.wrongTries=(G.wrongTries||0)+1;
  if(G.wrongTries<=SETTINGS.wrongRetry){
    msg(`"${w}"는 영어 단어 목록에 없어요. ${sug.length?`혹시 이 단어인가요? ${sug.join(' · ')}`:'철자를 다시 확인해 보세요.'} 한 번 더 써 보세요.`,'bad');
    inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400); inp.select(); return; }
  fail(`<b>${esc(w)}</b>는 영어 단어 목록에 없어요.${sug.length?` 혹시 <b>${sug.map(esc).join(' · ')}</b>?`:''}`, example(ch));
}
function example(ch){ const c=startsWith(ch,G.pool); return c.length?pickCore(c):null; }
function success(o){
  G.locked=true; stopTimer(); G.turns++; G.rights++; const spoken=speak(o.w); G.used.add(o.w);
  const wasHidden=G.listen&&!G.revealed;   // 듣고 쓰기: 이번 답으로 컴퓨터 단어를 공개함
  const inNb=!o.outside&&!!nb.items[o.w];   // 수첩 단어인지는 이번 정답으로 수첩에 모으기 전에 확인
  adapt(true); if(G.clean) G.cleanRun++;
  G.combo++; G.bestCombo=Math.max(G.bestCombo,G.combo); const pts=scoreFor(o,inNb); G.score+=pts;
  save.bestScore=save.bestScore||{}; if(G.score>(save.bestScore[G.L.id]||0)){ save.bestScore[G.L.id]=G.score; persist(); }
  checkBadges(o);
  const sc=$app.querySelector('#score'), cb2=$app.querySelector('#combo');
  if(sc) sc.textContent=`${G.score}점`; if(cb2) cb2.textContent=G.combo>=SETTINGS.combo.show?` · 🔥 ${G.combo}콤보`:'';
  if(SETTINGS.combo.celebrate.includes(G.combo)) celebrate(G.combo);
  if(o.core&&!o.outside&&!nb.tbSeen.includes(o.w)){ nb.tbSeen.push(o.w); nbAdd(o.w,'textbook'); } G.chain.push({w:o.w,d:disp(o),me:true}); G.streak++;
  if(G.streak>(save.best[G.L.id]||0)){save.best[G.L.id]=G.streak;persist();}
  if(G.listen&&!G.revealed){ G.revealed=true; G.myWord=disp(o); G.okNote=silentNote(G.cur.w,o.w[0]); render(); const cpuCard=$app.querySelector('.cpu .who'); if(cpuCard) cpuCard.textContent='🎧 컴퓨터가 읽은 단어'; }
  msg((o.outside?`좋아요! ${disp(o)} — 📗 단어장 밖 단어`:`좋아요! ${disp(o)} = ${o.ko}`)+(inNb?' 📒 수첩 단어!':'')+` (+${pts}점)`,'good');
  const g=G, P=SETTINGS.pace[track]||SETTINGS.pace.basic;
  const hold=wasHidden?(G.L.listen==='force'?SETTINGS.listen.challengeRevealHold:SETTINGS.listen.revealHold):0;   // 듣고 쓰기로 공개한 컴퓨터 단어를 보여 주는 여유
  // 마지막 정답: 통과는 바로 기록하고, 통과 화면은 잠시 뒤에. 듣고 쓰기면 다른 문제처럼 학생 단어를 다 읽고 쉰 뒤 공개 여유까지 보여 줌(그사이 다른 화면으로 가면 통과 화면은 띄우지 않음)
  if(G.streak>=G.L.goal){ recordPass(); (wasHidden?spoken.then(()=>wait((soundOn?P.after:0)+hold)):wait(600)).then(()=>{ if(G===g&&$app.querySelector('#hintArea')) startRest(); }); return; }
  // 학생 단어를 다 읽고 쉰 뒤에 컴퓨터 단어로(SETTINGS.pace: 모든 수준 1초·최소 2초)
  Promise.all([spoken.then(()=>wait((soundOn?P.after:0)+hold)),wait(P.gap)]).then(()=>{ if(G!==g) return;
    const next=pickCpu(last(o.w));
    if(!next){ toast('🤖','컴퓨터가 졌어요!',`컴퓨터가 <b>${esc(last(o.w))}</b>로 시작하는 단어를 못 찾았어요. 새 단어로 다시 시작해요.`,'계속',()=>{G.used.clear();archiveChain();setCpu(pickCpu(null));}); return; }
    setCpu(next);
  });
}
function fail(why,ex){
  G.locked=true; stopTimer(); G.turns++;
  if(ex) nbAdd(ex.w,'wrong');
  adapt(false); G.clean=false; G.cleanRun=0; G.failedBefore=true; const r=loseTurn();
  let revealHTML='';
  if(G.listen&&!G.revealed){ G.revealed=true; render(); revealHTML=`<p>🎧 컴퓨터 단어는 <span class="ex">${esc(disp(G.cur))}</span> (${esc(plainKo(G.cur.ko))})였어요.</p>${G.silent?`<p class="snote miss" id="missNote">💡 ${esc(G.silent)}</p>`:''}`; }
  const exHTML=ex?`<p>이런 단어가 있어요: <span class="ex">${esc(disp(ex))}</span> (${esc(ex.ko)}) ${ex.emoji||''}</p>`:'';
  const gf=G; setTimeout(()=>G===gf&&toast('😵','아쉬워요!',`<p>${why}</p>${revealHTML}${exHTML}${r.text}`,r.label,r.next),450);
}
// 단계 통과 기록(진도·배지·별). 통과 화면(startRest)은 success()에서 잠시 뒤에 띄움
function recordPass(){
  const L=G.L; save.cleared[L.id]=true; if(save.unlocked<L.id+1) save.unlocked=Math.min(LEVELS.length,L.id+1); persist();
  if(!G.hintUsed) award('nohint');
  if(LEVELS.every(x=>save.cleared[x.id])) award('master-'+track);
  bankStars();
}

// ---------- 단계 통과 뒤 화면(코드 이름 REST): ① 통과 요약 → ② 끝말잇기 하이라이트 → ③ 🎁 등급 상자 → ④ 컴퓨터의 한마디·다음 단계 (마지막 단계면 ④ 대신 수준 정복) ----------
let REST=null, boxRoll=null;   // boxRoll: 테스트용으로 다음 금상자의 보관 힌트 뽑기 결과를 정함(0~1)
const fmtTime=ms=>{ const t=Math.max(0,Math.round(ms/1000)), m=Math.floor(t/60), x=t%60; return m?`${m}분 ${x}초`:`${x}초`; };
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// 상자 등급: 하트를 하나도 잃지 않았거나(기초는 한 번도 안 틀림) 힌트 없이 통과 → 금, 하트 1개 잃음 → 은, 그 외 → 동
const GRADES={gold:{icon:'🥇',name:'금상자'},silver:{icon:'🥈',name:'은상자'},bronze:{icon:'🥉',name:'동상자'}};
const boxGrade=(lost,noHint)=>lost===0||noHint?'gold':lost===1?'silver':'bronze';
function startRest(){
  stopTimer(); if(keyHandler){ document.removeEventListener('keydown',keyHandler); keyHandler=null; }
  const L=G.L, nextL=LEVELS[L.id], lost=livesOn()?(G.livesLost||0):G.turns-G.rights;
  REST={L,nextL,step:1,stars:G.starsGot||0,turns:G.turns,rights:G.rights,ms:Date.now()-G.t0,score:G.score,bestCombo:G.bestCombo,
    noHint:!G.hintUsed,badges:G.newBadges.map(id=>BADGES.find(b=>b.id===id)).filter(Boolean),
    skip3:track==='basic'&&L.id===1&&G.firstTime&&G.clean&&G.cleanRun>=Math.min(SETTINGS.skipStreak,L.goal)&&LEVELS.length>=3,
    // 하이라이트: 이번 단계에서 이어 간 단어 모두(틀려서 새로 시작한 줄은 '새로 시작' 표시로 나눔). 틀린 시도와 대답하지 못한 컴퓨터 단어는 없음
    lost,grade:boxGrade(lost,!G.hintUsed),hl:[...G.lines,G.chain].flatMap((seg,k)=>[...(k?[{div:true}]:[]),...seg.map(x=>({w:x.w,d:x.d||x.w,me:!!x.me}))]),shown:0,opened:false,reward:null,line:''};
  renderRest();
}
function renderRest(){
  const S=REST, L=S.L, last=!S.nextL;
  const steps=['통과','끝말잇기','선물 상자',last?'정복':'다음 단계'];
  $app.innerHTML=`
  <div class="topbar"><button class="back" id="back">← <span class="t">단계 </span>목록</button><h2>🎉 ${last?`${TRACKS[track].name} 수준 정복!`:`${L.id}단계 통과!`}</h2><button class="back" id="snd" aria-pressed="${soundOn}" aria-label="소리">${sndHTML()}</button></div>
  <ol class="rsteps" aria-label="통과 뒤 순서">${steps.map((t,i)=>`<li class="${i+1===S.step?'on':i+1<S.step?'done':''}" ${i+1===S.step?'aria-current="step"':''}>${'①②③④'[i]} ${t}</li>`).join('')}</ol>
  <section class="rest pop" id="rest"></section>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>`;
  $app.querySelector('#back').onclick=home;
  $app.querySelector('#snd').onclick=()=>{soundOn=!soundOn;audioKeepAlive(soundOn);const b=$app.querySelector('#snd');b.innerHTML=sndHTML();b.setAttribute('aria-pressed',soundOn);};
  const box=$app.querySelector('#rest');
  [restSummary,restShow,restBox,last?restDone:restNext][S.step-1](box);
}
const restGo=step=>{ REST.step=step; renderRest(); };
// ① 통과 요약: 받은 별·정답률·걸린 시간, 이번에 얻은 배지, 힌트 없이 통과 축하
function restSummary(box){
  const S=REST, L=S.L, pct=S.turns?Math.round(S.rights/S.turns*100):0;
  box.innerHTML=`<div class="big-e">🏆</div><h3>${L.id}단계 통과!</h3>
    <p>${livesOn()?`하트를 다 잃기 전에 ${L.goal}번 성공했어요.`:`틀리지 않고 ${L.goal}번 연속 성공했어요.`}</p>
    <div class="rstats">
      <div><b id="rStars">⭐ +${S.stars}</b><small>받은 별</small></div>
      <div><b id="rAcc">${S.rights}/${S.turns}</b><small>정답률 ${pct}%</small></div>
      <div><b id="rTime">${fmtTime(S.ms)}</b><small>걸린 시간</small></div>
    </div>
    <p class="sum">이번 판 ${S.score}점 · 🔥 최고 콤보 ${S.bestCombo}</p>
    ${S.noHint?`<div class="nohint${reduceMotion()?'':' sparkle'}" role="status">✨ 힌트 없이 통과!</div>`:''}
    ${S.badges.length?`<p class="sum" id="rBadges">🏅 새 배지: ${S.badges.map(b=>b.icon+' '+esc(b.name)).join(', ')}</p>`:''}
    ${S.nextL?`<p><b>${S.nextL.id}단계 · ${esc(S.nextL.name)}</b>이 열렸어요.</p>`:''}
    ${S.skip3?'<p>🚀 힌트도 실수도 없이 해냈어요! 쉽게 느껴지면 3단계로 바로 가도 돼요.</p>':''}
    <div class="row"><button class="btn soft" id="again">이 단계 더 연습</button>${S.skip3?'<button class="btn soft" id="skip3">3단계로 바로 가기</button>':''}<button class="btn" id="go">다음 →</button></div>`;
  box.querySelector('#again').onclick=()=>start(L.id);
  box.querySelector('#skip3')?.addEventListener('click',()=>{ save.cleared[1]=save.cleared[2]=true; save.unlocked=Math.max(save.unlocked,3); persist(); start(3); });
  const go=box.querySelector('#go'); go.onclick=()=>restGo(2); go.focus();
}
// ② 끝말잇기 하이라이트(채팅): 컴퓨터 단어는 왼쪽, 내 단어는 오른쪽 말풍선. 새 말풍선이 아래에서 나오며 앞 말풍선을 위로 밀어 올림(SETTINGS.restBox.gap 간격)
// 화면을 누르거나 Enter면 전부 바로, 동작 줄이기면 처음부터 전부. 말풍선을 누르면 그 단어를 읽어 줌
function restShow(box){
  const S=REST, n=S.hl.length; if(reduceMotion()) S.shown=n;
  box.innerHTML=`<h3>💬 이번 끝말잇기</h3>
    <div class="hlbox" id="hlBox"><ol class="hl" id="hl" aria-label="방금 통과한 단계의 끝말잇기">${S.hl.map((x,i)=>x.div?`<li class="hdiv${i>=S.shown?' wait':''}"><span>새로 시작</span></li>`:`<li class="${x.me?'hme':'hcpu'}${i>=S.shown?' wait':''}"><button class="hb" data-i="${i}" aria-label="${x.me?'내 단어':'컴퓨터 단어'} ${esc(x.d)}. 누르면 읽어 줘요">${esc(x.d)}</button></li>`).join('')}</ol></div>
    <p class="hlnote" id="hlTip">말풍선을 누르면 단어를 읽어 줘요.${S.shown<n?' 화면을 누르거나 Enter를 누르면 전부 보여요.':''}</p>
    <div class="row"><button class="btn" id="go">다음 →</button></div>`;
  const hl=box.querySelector('#hl');
  fitBox(box.querySelector('#hlBox'),hl);
  hl.querySelectorAll('.hb').forEach(b=>b.onclick=()=>{ if(S.shown<n) return; audioKeepAlive(true); const o=soundOn; soundOn=true; speak(S.hl[+b.dataset.i].w); soundOn=o; });
  const go=box.querySelector('#go'); go.onclick=()=>restGo(3); go.focus();
  if(S.shown>=n) return;
  const alive=()=>REST===S&&S.step===2&&document.getElementById('hl')===hl;
  const done=()=>{ clearTimeout(S.tm); document.removeEventListener('keydown',onKey,true); document.removeEventListener('click',onClick,true);
    if(!alive()) return; S.shown=n; hl.querySelectorAll('li.wait,li.up').forEach(li=>li.classList.remove('wait','up'));   // 올라오던 말풍선도 바로 제자리에
    const tip=box.querySelector('#hlTip'); if(tip) tip.textContent='말풍선을 누르면 단어를 읽어 줘요.'; };
  const onKey=e=>{ if(!alive()) return done(); if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); done(); } };
  const onClick=e=>{ if(!alive()) return done(); if(e.target.closest('.topbar')) return; e.preventDefault(); e.stopPropagation(); done(); };
  document.addEventListener('keydown',onKey,true); document.addEventListener('click',onClick,true);
  const step=()=>{ if(!alive()) return done(); const li=hl.children[S.shown]; li.classList.remove('wait'); li.style.setProperty('--h',li.offsetHeight+'px'); li.style.setProperty('--dur',SETTINGS.restBox.rise+'ms'); li.classList.add('up'); li.addEventListener('animationend',()=>li.classList.remove('up'),{once:true});
    S.shown++; if(S.shown>=n) done(); else S.tm=setTimeout(step,SETTINGS.restBox.gap); };
  step();
}
// 하이라이트 상자 높이: 말풍선을 다 보였을 때 높이에 맞춤(적으면 빈 공간 없이, 많으면 CSS max-height까지 + 상자 안 스크롤). 올라오는 동안 화면이 밀리지 않게 미리 정함
function fitBox(bx,hl){
  const hidden=[...hl.children].filter(li=>li.classList.contains('wait')); hidden.forEach(li=>li.classList.remove('wait'));
  const cs=getComputedStyle(bx), need=hl.scrollHeight+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom), max=parseFloat(cs.maxHeight)||need;
  hidden.forEach(li=>li.classList.add('wait')); bx.style.height=Math.ceil(Math.min(need,max))+'px';
}
// ③ 🎁 선물 상자(따로 한 화면): 등급을 보여 주고 눌러서(Enter) 열기 → 보상, 그다음 "다음 →"
function restBox(box){
  const S=REST, g=GRADES[S.grade];
  if(!S.opened){
    box.innerHTML=`<h3 id="grade">${g.icon} ${g.name}</h3>
      <button class="giftbtn" id="openBox" aria-label="${g.name} 열기"><span class="gift" aria-hidden="true">🎁</span><span>눌러서 열기</span></button>`;
    const ob=box.querySelector('#openBox'); ob.onclick=openBox; ob.focus(); return;
  }
  const r=S.reward;
  box.innerHTML=`<div class="gift open" aria-hidden="true">${r.extra==='hint'?'💡':'⭐'}</div>
    <h3 id="reward">${g.icon} ${g.name}에서 ⭐ ${r.stars}개를 받았어요!</h3>
    ${r.extra?`<p class="sum" id="bonus">${r.extra==='hint'?`💡 보관 힌트 ${r.hint}개도 들어 있었어요! (${TRACKS[track].name} 수준에서 써요)`:`💡 보관 힌트가 가득 차서 ⭐ ${r.hintStars}개로 바꿔 줬어요!`}</p>`:''}
    <p class="sum">모은 별 ⭐ <b class="stars-n">${stars}</b></p>
    <div class="row"><button class="btn" id="go">${S.nextL?'다음 →':'🎉 확인'}</button></div>`;
  const go=box.querySelector('#go'); go.onclick=()=>restGo(4); go.focus();
}
// 상자 열기: 등급별 별 + 금상자는 hintChance% 확률로 보관 힌트(가득 찼거나 보관 기능이 없으면 별 fullHintStars개). 짧은 열림 효과(동작 줄이기면 생략)
function openBox(){
  const S=REST; if(!S||S.opened) return; const RB=SETTINGS.restBox, o=RB[S.grade];
  setStars(stars+o.stars); let extra='';
  if(o.hintChance&&(boxRoll!=null?boxRoll:Math.random())*100<o.hintChance){
    if(SETTINGS.shop.maxStored>0&&storeRoom()>0){ setStored(storedHints()+(o.hint||1)); extra='hint'; }
    else { setStars(stars+RB.fullHintStars); extra='hintStars'; } }
  boxRoll=null;
  S.opened=true; S.reward={grade:S.grade,stars:o.stars,extra,hint:o.hint||1,hintStars:RB.fullHintStars};
  const btn=$app.querySelector('#openBox'), g=btn&&btn.querySelector('.gift');
  if(g&&!reduceMotion()){ g.classList.add('opening'); btn.disabled=true; setTimeout(()=>{ if(REST===S&&S.step===3) renderRest(); },700); }
  else renderRest();
}
// ④ 🤖 컴퓨터의 한마디 + 다음 단계 시작
function restNext(box){
  const S=REST, N=S.nextL;
  if(!S.line){ const k=`${track}-${N.id}`; S.line=rnd(REST_LINES[k]||(N.listen==='force'?REST_LINES.listen:N.time?REST_LINES.time:REST_LINES.other)); }
  box.innerHTML=`<div class="bot"><span class="botface" aria-hidden="true">🤖</span><p class="bubble" id="line">${esc(S.line)}</p></div>
    <p class="nextinfo"><b>${N.id}단계 · ${esc(N.name)}</b> — ${esc(N.desc)}</p>
    <div class="row"><button class="btn soft" id="toList">단계 목록으로</button><button class="btn" id="startNext">▶ ${N.id}단계 시작</button></div>`;
  box.querySelector('#toList').onclick=home;
  const b=box.querySelector('#startNext'); b.onclick=()=>{ const id=N.id; REST=null; start(id); }; b.focus();
}
// 마지막 단계: ④ 대신 수준 정복
function restDone(box){
  box.innerHTML=`<div class="big-e">🎉</div><h3 id="conquer">${TRACKS[track].name} 수준 정복!</h3>
    <p>${TRACKS[track].name} 수준의 모든 단계를 통과했어요! ${track!=='hard'?'다음 수준에도 도전해 보세요.':'최고예요.'}</p>
    <div class="row"><button class="btn soft" id="toList">단계 목록으로</button><button class="btn" id="toTracks">수준 선택</button></div>`;
  box.querySelector('#toList').onclick=home;
  const b=box.querySelector('#toTracks'); b.onclick=()=>{ REST=null; chooseTrack(); }; b.focus();
}
function toast(e,title,body,label,fn,label2,fn2){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card pop" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="big-e">${e}</div><h3>${title}</h3><div>${body.startsWith('<')?body:'<p>'+body+'</p>'}</div>
    <div class="row">${label2?`<button class="btn soft" id="ov2">${label2}</button>`:''}<button class="btn" id="ov1">${label}</button></div></div>`;
  document.body.appendChild(ov);
  const b1=ov.querySelector('#ov1'); b1.focus();
  b1.onclick=()=>{ov.remove();fn();};
  if(label2) ov.querySelector('#ov2').onclick=()=>{ov.remove();fn2();};
  return ov;
}

// ---------- 힌트 ----------
function useHint(){
  if(G.locked||!canHint()) return;
  const ch=last(G.cur.w);
  if(GUIDED(G.L.mode)){
    const w=G.target.w, m=G.L.mode;
    if(m==='spell'){ if(G.reveal>=w.length-2){ msg('더 보여 줄 글자가 없어요. 골라 보세요!','info'); return; } G.reveal++; }
    if(m==='blocks'){ if(G.reveal>=w.length-2){ msg('더 보여 줄 글자가 없어요.','info'); return; }
      G.reveal++; G.placed.forEach(p=>p.used=false); G.placed=[];
      for(let k=1;k<=G.reveal;k++){ const b=G.blocks.find(x=>!x.used&&x.c===w[k]); if(b){ b.used=true; G.placed.push(b); } } }
    if(m==='blanks'){ if(G.blankIdx.length<=1){ msg('첫 글자 빈칸은 직접 채워 보세요! 컴퓨터 단어의 끝 글자를 봐요.','info'); return; } G.blankIdx.splice(1,1); G.reveal++; }
    nbAdd(w,'hint'); G.clean=false; G.hintUsed=true; G.turnHint=true; consumeHint(); G.hintStep++;
    const keepPlaced=G.placed; render(); G.placed=keepPlaced; if(G.blockDraw&&m==='blocks') G.blockDraw();
    msg('💡 한 글자를 더 보여 줬어요.','info'); return;
  }
  // 듣고 쓰기·듣기 챌린지(단어가 아직 안 보일 때): 시작 글자 대신 끝 글자를 찾을 단서. ① 끝에서 두 번째 글자와 위치 ② 뜻
  if(G.listen&&!G.revealed){
    if(G.hintStep>=LISTEN_HINTS){ msg('이 단어에 쓸 수 있는 힌트를 다 봤어요.','info'); return; }
    G.hintUsed=true; G.clean=false; G.turnHint=true; consumeHint(); G.hintStep++;
    const keep=$app.querySelector('#inp')?.value||''; render(); const inp=$app.querySelector('#inp'); if(inp) inp.value=keep;
    return;
  }
  G.hintUsed=true; G.clean=false; G.turnHint=true;
  if(G.L.mode==='choice'){
    const wrongs=G.options.filter(o=>o.w[0]!==ch&&!G.removed.has(o.w));
    if(wrongs.length<=1&&G.hintStep>0){ msg('이미 힌트를 썼어요. 남은 2개 중에서 골라 보세요!','info'); return; }
    // 오답을 지워 2개만 남기기
    shuffle(wrongs).slice(0,wrongs.length-1).forEach(o=>G.removed.add(o.w));
  }else{
    const maxStep=3;
    if(G.hintStep>=maxStep){ msg('이 단어에 쓸 수 있는 힌트를 다 봤어요.','info'); return; }
    if(!G.hintWord||G.hintWord.w[0]!==ch||G.used.has(G.hintWord.w)) G.hintWord=pickCore(startsWith(ch,G.pool).filter(x=>x.w.length>=G.L.min));
    if(G.hintWord) nbAdd(G.hintWord.w,'hint');
    if(G.L.time){ G.bonus=Math.min(G.bonus+5,G.elapsed); G.timeLeft=G.lim+G.bonus-G.elapsed; }
  }
  consumeHint(); G.hintStep++;
  const keep=$app.querySelector('#inp')?.value||'';
  render();
  const inp=$app.querySelector('#inp'); if(inp){inp.value=keep;}
}
// 듣기 힌트 ①: 끝에서 두 번째 글자만 위치와 함께(write → □ □ □ t □), 마지막 칸은 맞힐 칸
const LISTEN_HINTS=2;
const penPattern=w=>w.split('').map((c,i)=>i===w.length-2?c:'□').join(' ');
function showHint(){
  const area=$app.querySelector('#hintArea'); const ch=last(G.cur.w);
  if(G.listen&&!G.revealed){
    const c=G.cur, w=c.w, k=w.length, n=G.hintStep;
    area.innerHTML=`<div class="hintbox lhint">
      <div class="lboxes pen" id="penHint" role="img" data-pat="${esc(penPattern(w))}" aria-label="${k}글자 단어, 끝에서 두 번째 글자는 ${esc(w[k-2])}. 마지막 칸의 글자를 맞혀요">${w.split('').map((x,i)=>`<span class="lbox${i===k-2?' on':i===k-1?' qbox':''}" aria-hidden="true">${i===k-2?esc(x):i===k-1?'?':''}</span>`).join('')}</div>
      <div class="askcap"><span class="lbox qbox mini" aria-hidden="true">?</span> 이 글자를 맞혀요</div>
      <div id="penMsg">끝에서 두 번째 글자예요. 마지막 글자는 무엇일까요?</div>
      ${n>=2?`<div id="hintKo">뜻: <b>${esc(plainKo(c.ko))}</b></div>`:'<small>힌트를 한 번 더 쓰면 뜻을 보여 줘요.</small>'}
      <div><button class="speak" id="slowSay">🐢 천천히 듣기</button></div></div>`;
    area.querySelector('#slowSay').onclick=()=>{ audioKeepAlive(true); speak(c.w,false,SETTINGS.listen.slowRate); $app.querySelector('#inp')?.focus({preventScroll:true}); };
    return;
  }
  if(G.L.mode==='choice'){ area.innerHTML=`<div class="hintbox">💡 틀린 보기를 지웠어요. <b>${ch}</b>로 시작하는 단어를 찾아보세요!</div>`; return; }
  const h=G.hintWord; if(!h) return;
  const shown=G.hintStep; // 1: 뜻 + 첫 글자, 2: 두 글자, 3: 세 글자
  const pat=disp(h).split('').map((c,i)=>i<shown?c:'_').join(' ');
  area.innerHTML=`<div class="hintbox">💡 <b>${esc(h.ko)}</b> ${h.emoji||''} — ${h.w.length}글자${G.L.time?' (+5초)':''}<div class="pat word">${esc(pat)}</div>${shown<3?'<small>힌트를 한 번 더 쓰면 글자가 하나 더 보여요.</small>':''}</div>`;
}

// ---------- 타이머 ----------
function startTimer(){
  stopTimer(); let lastTick=Date.now();
  timerId=setInterval(()=>{
    const now=Date.now(); G.elapsed+=(now-lastTick)/1000; lastTick=now; G.timeLeft=G.lim+G.bonus-G.elapsed;
    const bar=$app.querySelector('#tbar');
    if(bar){bar.firstElementChild.style.width=Math.max(0,G.timeLeft/G.lim*100)+'%'; bar.classList.toggle('warn',G.timeLeft<6);}
    if(G.timeLeft<=0){ stopTimer(); fail('⏰ 시간이 다 됐어요.', example(last(G.cur.w))); }
  },200);
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }

chooseTrack();
})();
</script>
